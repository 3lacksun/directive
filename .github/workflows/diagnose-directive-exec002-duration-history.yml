name: Diagnose DIRECTIVE EXEC002 Duration and Suggestion Semantics

on:
  workflow_dispatch:
  push:
    branches: [directive-ci-build-05092026]
    paths:
      - '.github/workflows/diagnose-directive-exec002-duration-history.yml'

permissions:
  contents: read

env:
  SOURCE_REPO: 3lacksun/-directive-v2-offline
  PLANNER_SOURCE_SHA256: 23de17f28c0f2fa13f8a8cbc1d0d20ca6495003136e35d1845a681f8a29ccce8

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Require private token
        env:
          PRIVATE_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Download planner bundle and extract focused semantics
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private out src
          gh api "repos/$SOURCE_REPO/contents/support/directive_balanced_upgrade_sources.tgz.b64?ref=main" --jq .content \
            | tr -d '\n' | base64 --decode > private/bundle.b64
          base64 --decode private/bundle.b64 > private/bundle.tgz
          echo "$PLANNER_SOURCE_SHA256  private/bundle.tgz" | sha256sum -c -
          tar -xzf private/bundle.tgz -C src
          python3 - <<'PY' > out/DIRECTIVE_EXEC002_DURATION_HISTORY_SEMANTICS.txt
          from pathlib import Path
          import re
          files=sorted(Path('src').rglob('*.java'))
          needles=[
              'getDurationMinutes','setDurationMinutes','applyDefaultDurationToTask',
              'suggestedDuration','SharedPreferences','MODE_PRIVATE','history',
              'estimated','duration','suggest','recent','record','session'
          ]
          for p in files:
              lines=p.read_text(errors='ignore').splitlines()
              print(f'===== {p} =====')
              emitted=set()
              for i,line in enumerate(lines):
                  low=line.lower()
                  if any(n.lower() in low for n in needles):
                      a=max(0,i-4); b=min(len(lines),i+6)
                      key=(a,b)
                      if key in emitted: continue
                      emitted.add(key)
                      print(f'--- lines {a+1}-{b} ---')
                      for j in range(a,b): print(f'{j+1:04d}: {lines[j]}')
              print()
          PY
          grep -E "getDurationMinutes|setDurationMinutes|suggestedDuration|SharedPreferences|history|estimate|duration|suggest" out/DIRECTIVE_EXEC002_DURATION_HISTORY_SEMANTICS.txt | head -n 800 > out/FOCUSED.txt || true
          cp out/FOCUSED.txt out/REPORT.txt
      - name: Upload focused diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE-EXEC002-duration-history-semantics
          path: out
          if-no-files-found: error
