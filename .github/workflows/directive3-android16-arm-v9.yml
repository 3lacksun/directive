name: DIRECTIVE 3 Android 16 ARM Smoke v9

on:
  push:
    branches: [directive2-github-build]
    paths:
      - '.github/workflows/directive3-android16-arm-v9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Build and Android 16 ARM install smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build DIRECTIVE 3 exact candidate
        shell: bash
        run: |
          chmod +x support/directive3_install_safe_build.sh
          support/directive3_install_safe_build.sh
      - name: Android 16 ARM smoke acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eu
            mkdir -p out-v8/runtime
            APK=out-v8/DIRECTIVE_3_3.0.0_INSTALL_SAFE_TEST.apk
            adb wait-for-device
            adb shell getprop ro.build.version.sdk | tee out-v8/runtime/API_LEVEL.txt
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = '36'
            adb install "$APK" 2>&1 | tee out-v8/runtime/ADB_INSTALL.txt
            grep -q 'Success' out-v8/runtime/ADB_INSTALL.txt
            adb shell pm path com.directive.v3 | tee out-v8/runtime/PACKAGE_PATH.txt
            adb logcat -c
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p com.directive.v3 2>&1 | tee out-v8/runtime/COLD_LAUNCH.txt
            sleep 8
            adb shell pidof com.directive.v3 | tee out-v8/runtime/PID.txt
            test -s out-v8/runtime/PID.txt
            adb logcat -d -v threadtime > out-v8/runtime/LOGCAT.txt
            if grep -E 'FATAL EXCEPTION|ForegroundServiceDidNotStartInTimeException|RemoteServiceException.*startForeground|Process: com\.directive\.v3.*FATAL' out-v8/runtime/LOGCAT.txt; then
              echo 'ANDROID16_ARM_SMOKE=FAIL_CRASH' | tee out-v8/runtime/STATUS.txt
              exit 1
            fi
            printf '%s\n' 'ANDROID16_ARM_SMOKE=PASS' 'clean_install=PASS' 'cold_launch_process_alive=PASS' 'fatal_crash_scan=PASS' 'physical_samsung_acceptance=UNEXECUTED' 'final_go=false' | tee out-v8/runtime/STATUS.txt
      - name: Upload runtime APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE_3_ANDROID16_ARM_v9
          path: |
            out-v8/DIRECTIVE_3_3.0.0_INSTALL_SAFE_TEST.apk
            out-v8/evidence/
            out-v8/runtime/
          if-no-files-found: warn
          retention-days: 30
