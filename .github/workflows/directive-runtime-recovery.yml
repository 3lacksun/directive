name: DIRECTIVE Android 16 Runtime Recovery

on:
  workflow_dispatch:
  push:
    branches: [directive-ci-build-05092026]
    paths:
      - '.github/workflows/directive-runtime-recovery.yml'

permissions:
  contents: read

env:
  SOURCE_REPO: 3lacksun/-directive-v2-offline
  PRIVATE_CANDIDATE_TAG: directive-ci-candidate
  PRIVATE_RELEASE_TAG: directive-ci-build-latest
  CANDIDATE_NAME: DIRECTIVE_CANDIDATE_33984385490.apk
  CANDIDATE_SHA256: c7570d5024bda5164e4f3d5ec4f1fdd510da623cdebee67bb3b332951b8fc495
  APPLICATION_ID: com.ticktick.task
  TARGET_SDK: '37'

jobs:
  runtime_x86_64:
    name: Android 16 x86_64 compatibility runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      accepted: ${{ steps.verdict.outputs.accepted }}
    steps:
      - name: Require private DIRECTIVE source token
        env:
          PRIVATE_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Download exact signed candidate and verifier
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate runtime-support out/runtime
          gh release download "$PRIVATE_CANDIDATE_TAG" --repo "$SOURCE_REPO" \
            --pattern "$CANDIDATE_NAME" --dir candidate
          echo "$CANDIDATE_SHA256  candidate/$CANDIDATE_NAME" | sha256sum -c -
          gh api "repos/$SOURCE_REPO/contents/support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh?ref=main" \
            --jq .content | tr -d '\n' | base64 --decode \
            > runtime-support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh
          chmod +x runtime-support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh
          echo "APK_PATH=candidate/$CANDIDATE_NAME" >> "$GITHUB_ENV"

      - name: Android 16 x86_64 clean-install offline acceptance
        id: runtime
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          APPLICATION_ID: ${{ env.APPLICATION_ID }}
          APK_PATH: ${{ env.APK_PATH }}
          TARGET_SDK: ${{ env.TARGET_SDK }}
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash runtime-support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh

      - name: Record x86_64 verdict
        id: verdict
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.runtime.outcome }}" = "success" ]; then
            echo 'accepted=true' >> "$GITHUB_OUTPUT"
            echo 'PASS: Android 16 x86_64 runtime accepted exact DIRECTIVE candidate' > out/runtime/DIRECTIVE_X86_64_GATE.txt
          else
            echo 'accepted=false' >> "$GITHUB_OUTPUT"
            echo 'NOT ACCEPTED: Android 16 x86_64 runtime path did not accept exact DIRECTIVE candidate' > out/runtime/DIRECTIVE_X86_64_GATE.txt
          fi

      - name: Upload x86_64 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE-runtime-x86_64-evidence
          retention-days: 7
          if-no-files-found: warn
          path: out/runtime/

  runtime_arm64_tcg:
    name: Android 16 ARM64 software-emulation runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      accepted: ${{ steps.verdict.outputs.accepted }}
    steps:
      - name: Require private DIRECTIVE source token
        env:
          PRIVATE_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Download exact signed candidate and verifier
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate runtime-support out/runtime
          gh release download "$PRIVATE_CANDIDATE_TAG" --repo "$SOURCE_REPO" \
            --pattern "$CANDIDATE_NAME" --dir candidate
          echo "$CANDIDATE_SHA256  candidate/$CANDIDATE_NAME" | sha256sum -c -
          gh api "repos/$SOURCE_REPO/contents/support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh?ref=main" \
            --jq .content | tr -d '\n' | base64 --decode \
            > runtime-support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh
          chmod +x runtime-support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh
          echo "APK_PATH=candidate/$CANDIDATE_NAME" >> "$GITHUB_ENV"

      - name: Android 16 ARM64 software-emulated clean-install offline acceptance
        id: runtime
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          APPLICATION_ID: ${{ env.APPLICATION_ID }}
          APK_PATH: ${{ env.APK_PATH }}
          TARGET_SDK: ${{ env.TARGET_SDK }}
        with:
          api-level: 36
          arch: arm64-v8a
          target: default
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          disable-linux-hw-accel: true
          disable-animations: true
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off -no-metrics
          script: bash runtime-support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh

      - name: Record ARM64 TCG verdict
        id: verdict
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.runtime.outcome }}" = "success" ]; then
            echo 'accepted=true' >> "$GITHUB_OUTPUT"
            echo 'PASS: Android 16 ARM64 software-emulated runtime accepted exact DIRECTIVE candidate' > out/runtime/DIRECTIVE_ARM64_TCG_GATE.txt
          else
            echo 'accepted=false' >> "$GITHUB_OUTPUT"
            echo 'NOT ACCEPTED: Android 16 ARM64 software-emulated runtime path did not complete acceptance' > out/runtime/DIRECTIVE_ARM64_TCG_GATE.txt
          fi

      - name: Upload ARM64 TCG diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE-runtime-arm64-tcg-evidence
          retention-days: 7
          if-no-files-found: warn
          path: out/runtime/

  publish_runtime_accepted:
    name: Publish exact runtime-accepted DIRECTIVE candidate
    needs: [runtime_x86_64, runtime_arm64_tcg]
    if: ${{ always() && (needs.runtime_x86_64.outputs.accepted == 'true' || needs.runtime_arm64_tcg.outputs.accepted == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require private DIRECTIVE source token
        env:
          PRIVATE_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Download exact candidate and runtime evidence
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate evidence out
          gh release download "$PRIVATE_CANDIDATE_TAG" --repo "$SOURCE_REPO" \
            --pattern "$CANDIDATE_NAME" --dir candidate
          echo "$CANDIDATE_SHA256  candidate/$CANDIDATE_NAME" | sha256sum -c -

      - name: Download this run's runtime evidence
        uses: actions/download-artifact@v4
        with:
          pattern: DIRECTIVE-runtime-*-evidence
          path: evidence
          merge-multiple: false

      - name: Finalise and privately publish timestamped DIRECTIVE APK
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TIMESTAMP="$(TZ=Europe/London date +'%d%m%Y%H%M%S')"
          FINAL_APK="out/DIRECTIVE_${TIMESTAMP}.apk"
          FINAL_SHA="${FINAL_APK}.sha256"
          EVIDENCE_ZIP="out/DIRECTIVE_RUNTIME_EVIDENCE_${TIMESTAMP}.zip"
          cp "candidate/$CANDIDATE_NAME" "$FINAL_APK"
          sha256sum "$FINAL_APK" | tee "$FINAL_SHA"
          ACTUAL="$(sha256sum "$FINAL_APK" | awk '{print $1}')"
          test "$ACTUAL" = "$CANDIDATE_SHA256"
          (cd evidence && zip -qr "../$EVIDENCE_ZIP" .)
          {
            echo 'Product: DIRECTIVE'
            echo 'Android runtime acceptance: PASS'
            echo "Target SDK: $TARGET_SDK"
            echo "APK SHA-256: $ACTUAL"
            echo "x86_64 gate: ${{ needs.runtime_x86_64.outputs.accepted }}"
            echo "ARM64 software-emulation gate: ${{ needs.runtime_arm64_tcg.outputs.accepted }}"
          } > out/DIRECTIVE_RELEASE_METADATA.txt

          gh release view "$PRIVATE_RELEASE_TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1 \
            || gh release create "$PRIVATE_RELEASE_TAG" --repo "$SOURCE_REPO" \
                 --title 'DIRECTIVE Runtime-Accepted Build' \
                 --notes 'Runtime-accepted Android 16 offline DIRECTIVE APK.'

          gh release view "$PRIVATE_RELEASE_TAG" --repo "$SOURCE_REPO" --json assets --jq '.assets[].name' \
            | grep -E '^DIRECTIVE_[0-9]{14}\.apk(\.sha256)?$|^DIRECTIVE_RUNTIME_EVIDENCE_[0-9]{14}\.zip$|^DIRECTIVE_RELEASE_METADATA\.txt$' \
            | while IFS= read -r old; do
                gh release delete-asset "$PRIVATE_RELEASE_TAG" "$old" --repo "$SOURCE_REPO" --yes || true
              done

          gh release upload "$PRIVATE_RELEASE_TAG" \
            "$FINAL_APK" "$FINAL_SHA" "$EVIDENCE_ZIP" out/DIRECTIVE_RELEASE_METADATA.txt \
            --repo "$SOURCE_REPO" --clobber
          echo "FINAL_APK_NAME=$(basename "$FINAL_APK")" >> "$GITHUB_ENV"
          echo "FINAL_APK_SHA256=$ACTUAL" >> "$GITHUB_ENV"
          printf 'PASS: runtime-accepted DIRECTIVE release published privately as %s\n' "$(basename "$FINAL_APK")"
