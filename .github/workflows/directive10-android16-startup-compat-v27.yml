name: DIRECTIVE 10 Android 16 Startup Compatibility v27
on:
  push:
    branches: [directive2-github-build]
    paths:
      - 'support/directive10_android16_startup_compat_build.sh'
      - 'support/patch_directive_android16_startup_compat.py'
      - 'support/patch_directive_startup_crash_capture.py'
      - '.github/workflows/directive10-android16-startup-compat-v27.yml'
      - 'DIRECTIVE2_SOURCE.json'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build DIRECTIVE 10 Android 16 compatibility candidate
        run: bash support/directive10_android16_startup_compat_build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE_10_10.0.0_ANDROID16_STARTUP_COMPAT_v27
          path: out-v10/
          if-no-files-found: error
