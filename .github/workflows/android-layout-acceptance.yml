name: DIRECTIVE Android Layout Acceptance
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  layout:
    name: API 37 adaptive layout acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download verified run 23 APKs
        uses: actions/download-artifact@v4
        with:
          name: directive-android-build
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33738227096
      - name: Verify APK checksums
        run: sha256sum -c artifact/SHA256SUMS.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
      - name: Boot API 37 emulator
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          IMAGE='system-images;android-37.0;google_apis;x86_64'
          sdkmanager 'platform-tools' 'emulator' "$IMAGE"
          echo no | avdmanager create avd --force --name directive-layout --package "$IMAGE"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd directive-layout -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect > artifact/LAYOUT_EMULATOR_LOG.txt 2>&1 &
          adb wait-for-device
          for i in $(seq 1 180); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ] && break
            sleep 2
          done
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = '37'
      - name: Install APKs and resolve runner
        shell: bash
        run: |
          set -euo pipefail
          adb install artifact/DIRECTIVE-1.0.0-debug.apk
          adb install artifact/DIRECTIVE-1.0.0-androidTest.apk
          adb shell pm list instrumentation | tr -d '\r' > artifact/LAYOUT_INSTRUMENTATION_LIST.txt
          RUNNER="$(awk '/\(target=com.example.directive.debug\)/ {v=$1; sub(/^instrumentation:/,"",v); print v; exit}' artifact/LAYOUT_INSTRUMENTATION_LIST.txt)"
          test -n "$RUNNER"
          printf '%s\n' "$RUNNER" > artifact/LAYOUT_RUNNER.txt
      - name: Verify light theme and enlarged font
        shell: bash
        run: |
          set -euo pipefail
          RUNNER="$(cat artifact/LAYOUT_RUNNER.txt)"
          CLASS='com.example.directive.DirectiveLaunchAccessibilityInstrumentedTest'
          adb shell cmd uimode night no
          adb shell settings put system font_scale 1.5
          sleep 2
          adb shell am instrument -w -e class "$CLASS" "$RUNNER" | tee artifact/LIGHT_FONT_UI.txt
          grep -Eq 'OK \([0-9]+ tests?\)' artifact/LIGHT_FONT_UI.txt
          ! grep -q 'FAILURES!!!' artifact/LIGHT_FONT_UI.txt
      - name: Verify tablet sized layout
        shell: bash
        run: |
          set -euo pipefail
          RUNNER="$(cat artifact/LAYOUT_RUNNER.txt)"
          CLASS='com.example.directive.DirectiveLaunchAccessibilityInstrumentedTest'
          adb shell settings put system font_scale 1.0
          adb shell wm size 1600x2560
          adb shell wm density 320
          sleep 2
          adb shell wm size | tee artifact/TABLET_SIZE.txt
          adb shell wm density | tee artifact/TABLET_DENSITY.txt
          adb shell am instrument -w -e class "$CLASS" "$RUNNER" | tee artifact/TABLET_UI.txt
          grep -Eq 'OK \([0-9]+ tests?\)' artifact/TABLET_UI.txt
          ! grep -q 'FAILURES!!!' artifact/TABLET_UI.txt
      - name: Verify landscape layout
        shell: bash
        run: |
          set -euo pipefail
          RUNNER="$(cat artifact/LAYOUT_RUNNER.txt)"
          CLASS='com.example.directive.DirectiveLaunchAccessibilityInstrumentedTest'
          adb shell wm size reset
          adb shell wm density reset
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          sleep 2
          adb shell am instrument -w -e class "$CLASS" "$RUNNER" | tee artifact/LANDSCAPE_UI.txt
          grep -Eq 'OK \([0-9]+ tests?\)' artifact/LANDSCAPE_UI.txt
          ! grep -q 'FAILURES!!!' artifact/LANDSCAPE_UI.txt
      - name: Upload layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directive-android-layout-acceptance
          path: artifact/
          retention-days: 30
