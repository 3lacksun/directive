name: DIRECTIVE 13 Android 16 Hook Convergence v33

on:
  workflow_dispatch:
  push:
    branches:
      - directive2-github-build
    paths:
      - 'support/directive13_android16_hook_convergence_build.sh'
      - 'support/patch_directive_android16_activitythread_hook.py'
      - '.github/workflows/directive13-android16-hook-convergence-v33.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify DIRECTIVE 13
        shell: bash
        run: |
          chmod +x support/directive13_android16_hook_convergence_build.sh
          support/directive13_android16_hook_convergence_build.sh
      - name: Upload APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE_13_13.0.0_ANDROID16_HOOK_CONVERGENCE_v33
          path: |
            out-v13/DIRECTIVE_13_13.0.0_INSTALL_SAFE_TEST.apk
            out-v13/evidence/
          if-no-files-found: error
          retention-days: 30
