name: DIRECTIVE 6 Launcher Alias Fix v15

on:
  workflow_dispatch:
  push:
    branches:
      - directive2-github-build
    paths:
      - 'support/directive6_launcher_alias_fix_build.sh'
      - 'support/patch_directive_launcher_alias_namespace.py'
      - '.github/workflows/directive6-launcher-alias-fix-v15.yml'
      - 'DIRECTIVE2_SOURCE.json'

permissions:
  contents: read

jobs:
  build:
    name: Build and verify DIRECTIVE 6 launcher namespace fix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build DIRECTIVE 6
        shell: bash
        run: |
          chmod +x support/directive6_launcher_alias_fix_build.sh
          support/directive6_launcher_alias_fix_build.sh
      - name: Upload APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE_6_6.0.0_LAUNCHER_ALIAS_FIX_v15
          path: |
            out-v8/DIRECTIVE_6_6.0.0_INSTALL_SAFE_TEST.apk
            out-v8/evidence/
          if-no-files-found: error
          retention-days: 30
