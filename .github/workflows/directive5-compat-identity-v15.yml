name: DIRECTIVE 5 Compatibility Identity v15

on:
  push:
    branches: [directive2-github-build]
    paths:
      - 'support/directive5_compat_identity_build.sh'
      - '.github/workflows/directive5-compat-identity-v15.yml'
      - 'DIRECTIVE2_SOURCE.json'
      - 'support/patch_directive_launcher_identity.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DIRECTIVE 5 compatibility-identity candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and statically verify compatibility baseline
        shell: bash
        run: |
          chmod +x support/directive5_compat_identity_build.sh
          support/directive5_compat_identity_build.sh
      - name: Upload APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE_5_5.0.0_COMPAT_IDENTITY_v15
          path: |
            out-v15/DIRECTIVE_5_5.0.0_COMPAT_IDENTITY_TEST.apk
            out-v15/evidence/
          if-no-files-found: error
          retention-days: 30
