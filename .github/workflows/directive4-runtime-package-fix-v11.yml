name: DIRECTIVE 4 Runtime Package Fix v11

on:
  push:
    branches: [directive2-github-build]
    paths:
      - 'support/patch_directive_runtime_package_identity.py'
      - 'support/directive4_runtime_package_fix_build.sh'
      - '.github/workflows/directive4-runtime-package-fix-v11.yml'
      - 'support/directive3_install_safe_build.sh'
      - 'DIRECTIVE2_SOURCE.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify DIRECTIVE 4 runtime identity fix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build DIRECTIVE 4 targeted runtime-fix candidate
        shell: bash
        run: |
          chmod +x support/directive4_runtime_package_fix_build.sh
          support/directive4_runtime_package_fix_build.sh
      - name: Upload APK and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE_4_4.0.0_RUNTIME_PACKAGE_FIX_v11
          path: |
            out-v8/DIRECTIVE_4_4.0.0_INSTALL_SAFE_TEST.apk
            out-v8/evidence/
          if-no-files-found: error
          retention-days: 30
