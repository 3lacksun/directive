name: DIRECTIVE 4 Post-build Forensic v12

on:
  push:
    branches: [directive2-github-build]
    paths:
      - 'support/directive4_postbuild_forensic_scan.py'
      - '.github/workflows/directive4-postbuild-forensic-v12.yml'
      - 'support/directive4_runtime_package_fix_build.sh'
      - 'support/patch_directive_runtime_package_identity.py'
      - 'support/directive3_install_safe_build.sh'
      - 'DIRECTIVE2_SOURCE.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic:
    name: Rebuild and inspect DIRECTIVE 4 startup identity
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Rebuild current DIRECTIVE 4 candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x support/directive4_runtime_package_fix_build.sh
          support/directive4_runtime_package_fix_build.sh
      - name: Run post-build source forensics
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="$(sed -n 's/^PROJECT_ROOT=//p' out-v8/evidence/PROJECT_ROOT.txt | tail -n1)"
          test -d "$PROJECT_ROOT"
          python3 support/directive4_postbuild_forensic_scan.py "$PROJECT_ROOT" com.directive.v4 | tee out-v8/evidence/DIRECTIVE4_POSTBUILD_FORENSIC_SUMMARY.txt
          cp "$PROJECT_ROOT/DIRECTIVE4_POSTBUILD_FORENSIC.json" out-v8/evidence/
          python3 - <<'PY'
          import json
          p='out-v8/evidence/DIRECTIVE4_POSTBUILD_FORENSIC.json'
          d=json.load(open(p,encoding='utf-8'))
          print('remaining_exact_smali_package_literals=',d['remaining_exact_smali_package_literals'])
          print('high_risk_occurrences=',d['high_risk_occurrences'])
          print('application_icon=',d['manifest']['application_icon'])
          print('application_round_icon=',d['manifest']['application_round_icon'])
          if not d['manifest']['package_target_present']:
              raise SystemExit('target package missing from source manifest')
          PY
      - name: Upload APK and forensic evidence
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE_4_POSTBUILD_FORENSIC_v12
          path: |
            out-v8/DIRECTIVE_4_4.0.0_INSTALL_SAFE_TEST.apk
            out-v8/evidence/
          if-no-files-found: error
          retention-days: 30
