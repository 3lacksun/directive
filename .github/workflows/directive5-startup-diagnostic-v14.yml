name: DIRECTIVE 5 Startup Diagnostic v14

on:
  push:
    branches: [directive2-github-build]
    paths:
      - 'support/directive5_startup_diagnostic_build.sh'
      - 'support/patch_directive_startup_diagnostics.py'
      - '.github/workflows/directive5-startup-diagnostic-v14.yml'
      - 'DIRECTIVE2_SOURCE.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build diagnostic candidate
        shell: bash
        run: |
          chmod +x support/directive5_startup_diagnostic_build.sh
          support/directive5_startup_diagnostic_build.sh
      - name: Upload APK and diagnostics evidence
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE_5_5.0.0_STARTUP_DIAGNOSTIC_v14
          path: |
            out-v8/DIRECTIVE_5_5.0.0_INSTALL_SAFE_TEST.apk
            out-v8/evidence/
          if-no-files-found: error
          retention-days: 30
