name: Directive V2 Runtime Crash Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - directive-v2-ci-probe-04092026
    paths:
      - '.github/workflows/directive-v2-runtime-diagnostic.yml'
      - 'ci/directive-v2-runtime-trigger/**'

permissions:
  contents: read

env:
  SOURCE_REPO: 3lacksun/-directive-v2-offline
  BUILD_RELEASE_TAG: directive-v2-ci-build-latest
  APK_ASSET: Directive-V2-debug.apk
  RUNTIME_RELEASE_TAG: directive-v2-runtime-diagnostic-latest
  PACKAGE_ID: com.ticktick.task

jobs:
  runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Require private-source token
        env:
          PRIVATE_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN"

      - name: Download latest private APK
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk runtime-evidence
          gh release download "$BUILD_RELEASE_TAG" --repo "$SOURCE_REPO" --pattern "$APK_ASSET" --dir apk
          test -s "apk/$APK_ASSET"
          sha256sum "apk/$APK_ASSET" | tee runtime-evidence/apk.sha256

      - name: Prepare ARM64 runtime diagnostic script
        shell: bash
        run: |
          cat > runtime-test.sh <<'BASH'
          #!/usr/bin/env bash
          set -uo pipefail
          mkdir -p runtime-evidence
          : > runtime-evidence/logcat.txt
          : > runtime-evidence/crash-excerpt.txt
          adb wait-for-device
          adb shell getprop ro.build.version.release | tee runtime-evidence/android-version.txt
          set +e
          adb install -r apk/Directive-V2-debug.apk > runtime-evidence/install.txt 2>&1
          INSTALL_RC=$?
          set -e
          cat runtime-evidence/install.txt
          if [ "$INSTALL_RC" -ne 0 ]; then
            printf 'install_failed=true\ninstall_rc=%s\nfatal=false\npid=none\n' "$INSTALL_RC" > runtime-evidence/result.txt
            exit 0
          fi
          adb logcat -c || true
          adb shell am force-stop com.ticktick.task || true
          adb shell monkey -p com.ticktick.task -c android.intent.category.LAUNCHER 1 > runtime-evidence/launch.txt 2>&1 || true
          cat runtime-evidence/launch.txt || true
          sleep 15
          adb shell dumpsys activity activities > runtime-evidence/dumpsys-activities.txt 2>&1 || true
          adb shell dumpsys package com.ticktick.task > runtime-evidence/dumpsys-package.txt 2>&1 || true
          adb logcat -d -v threadtime > runtime-evidence/logcat.txt 2>&1 || true
          adb shell pidof com.ticktick.task > runtime-evidence/pid.txt 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('runtime-evidence/logcat.txt').read_text('utf-8', errors='replace')
          lines = text.splitlines()
          patterns=(r'FATAL EXCEPTION', r'AndroidRuntime', r'Process: com\.ticktick\.task', r'Unable to start', r'Unable to instantiate', r'ClassNotFoundException', r'NoClassDefFoundError', r'Resources\$NotFoundException', r'SecurityException', r'IllegalStateException', r'NullPointerException', r'RuntimeException', r'UnsatisfiedLinkError')
          rx=re.compile('|'.join(patterns), re.I)
          keep=[]
          seen=set()
          for i,line in enumerate(lines):
              if rx.search(line):
                  a=max(0,i-12); b=min(len(lines),i+70)
                  key=(a,b)
                  if key in seen: continue
                  seen.add(key)
                  keep.extend(lines[a:b]); keep.append('---')
          Path('runtime-evidence/crash-excerpt.txt').write_text('\n'.join(keep) if keep else 'NO_CRASH_SIGNATURE_FOUND\n','utf-8')
          fatal = ('FATAL EXCEPTION' in text and ('com.ticktick.task' in text or 'Process: com.ticktick.task' in text))
          pid=Path('runtime-evidence/pid.txt').read_text('utf-8', errors='ignore').strip()
          result=f'install_failed=false\nfatal={str(fatal).lower()}\npid={pid or "none"}\n'
          Path('runtime-evidence/result.txt').write_text(result,'utf-8')
          print(result)
          PY
          BASH
          chmod +x runtime-test.sh

      - name: Boot ARM64 emulator, install, launch, capture crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          emulator-boot-timeout: 1200
          script: bash runtime-test.sh

      - name: Publish runtime evidence privately
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          test -f runtime-evidence/result.txt || printf 'diagnostic_incomplete=true\n' > runtime-evidence/result.txt
          test -f runtime-evidence/crash-excerpt.txt || printf 'NO_CRASH_EXCERPT_CAPTURED\n' > runtime-evidence/crash-excerpt.txt
          test -f runtime-evidence/logcat.txt || : > runtime-evidence/logcat.txt
          tar -czf directive-v2-runtime-evidence.tar.gz runtime-evidence
          if ! gh release view "$RUNTIME_RELEASE_TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            gh release create "$RUNTIME_RELEASE_TAG" --repo "$SOURCE_REPO" --target main --title 'Directive V2 Runtime Diagnostic' --notes 'Automated ARM64 emulator install/launch/logcat diagnostic evidence.'
          fi
          gh release upload "$RUNTIME_RELEASE_TAG" --repo "$SOURCE_REPO" directive-v2-runtime-evidence.tar.gz runtime-evidence/result.txt runtime-evidence/crash-excerpt.txt runtime-evidence/logcat.txt --clobber

      - name: Evaluate runtime result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat runtime-evidence/result.txt || true
          if grep -q '^install_failed=true' runtime-evidence/result.txt 2>/dev/null; then
            echo 'FAIL: ARM64 emulator install failed' >&2
            exit 1
          fi
          if grep -q '^fatal=true' runtime-evidence/result.txt 2>/dev/null; then
            echo 'FAIL: Directive V2 fatal runtime crash reproduced' >&2
            cat runtime-evidence/crash-excerpt.txt || true
            exit 1
          fi
          if grep -q '^diagnostic_incomplete=true' runtime-evidence/result.txt 2>/dev/null; then
            echo 'FAIL: runtime diagnostic did not complete' >&2
            exit 1
          fi
          echo 'PASS: no package fatal crash detected in diagnostic window'
