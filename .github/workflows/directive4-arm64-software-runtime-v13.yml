name: DIRECTIVE 4 ARM64 Software Runtime v13

on:
  push:
    branches: [directive2-github-build]
    paths:
      - '.github/workflows/directive4-arm64-software-runtime-v13.yml'
      - 'support/directive4_runtime_package_fix_build.sh'
      - 'support/patch_directive_runtime_package_identity.py'
      - 'support/patch_directive_launcher_identity.py'
      - 'DIRECTIVE2_SOURCE.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Build and capture ARM64 cold launch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      API_LEVEL: '36'
      AVD_NAME: directive4_arm64_api36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK, emulator and ARM64 image
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            'platform-tools' \
            'emulator' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            "system-images;android-${API_LEVEL};google_apis;arm64-v8a"
      - name: Build icon-corrected DIRECTIVE 4 APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x support/directive4_runtime_package_fix_build.sh
          support/directive4_runtime_package_fix_build.sh
      - name: Create ARM64 AVD
        shell: bash
        run: |
          set -euo pipefail
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name "$AVD_NAME" \
            --package "system-images;android-${API_LEVEL};google_apis;arm64-v8a" \
            --device 'pixel_6'
          cat "$HOME/.android/avd/${AVD_NAME}.avd/config.ini" | tee out-v8/evidence/AVD_CONFIG.txt
      - name: Boot ARM64 emulator without hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out-v8/evidence
          "$ANDROID_HOME/emulator/emulator" \
            -avd "$AVD_NAME" \
            -accel off \
            -no-window \
            -no-audio \
            -no-snapshot \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -memory 2048 \
            -cores 2 \
            -camera-back none \
            -camera-front none \
            > out-v8/evidence/EMULATOR_STDOUT.txt 2>&1 &
          echo $! > out-v8/evidence/EMULATOR_PID.txt
          "$ANDROID_HOME/platform-tools/adb" wait-for-device || true
          ready=0
          for i in $(seq 1 180); do
            state=$("$ANDROID_HOME/platform-tools/adb" get-state 2>/dev/null || true)
            boot=$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            echo "attempt=$i state=$state boot=$boot" | tee -a out-v8/evidence/BOOT_WAIT.txt
            if [ "$state" = device ] && [ "$boot" = 1 ]; then ready=1; break; fi
            sleep 5
          done
          echo "boot_ready=$ready" | tee out-v8/evidence/BOOT_STATUS.txt
          if [ "$ready" != 1 ]; then
            "$ANDROID_HOME/platform-tools/adb" devices -l | tee out-v8/evidence/ADB_DEVICES.txt || true
            tail -n 300 out-v8/evidence/EMULATOR_STDOUT.txt | tee out-v8/evidence/EMULATOR_TAIL.txt || true
            exit 86
          fi
          "$ANDROID_HOME/platform-tools/adb" shell getprop ro.build.version.release | tee out-v8/evidence/DEVICE_ANDROID_RELEASE.txt
          "$ANDROID_HOME/platform-tools/adb" shell getprop ro.build.version.sdk | tee out-v8/evidence/DEVICE_API_LEVEL.txt
          "$ANDROID_HOME/platform-tools/adb" shell getprop ro.product.cpu.abi | tee out-v8/evidence/DEVICE_ABI.txt
      - name: Install and capture cold launch
        shell: bash
        run: |
          set -uo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          APK=out-v8/DIRECTIVE_4_4.0.0_INSTALL_SAFE_TEST.apk
          PKG=com.directive.v4
          mkdir -p out-v8/evidence
          "$ADB" install -r "$APK" > out-v8/evidence/ADB_INSTALL.txt 2>&1
          install_rc=$?
          echo "install_rc=$install_rc" | tee out-v8/evidence/INSTALL_STATUS.txt
          if [ "$install_rc" -ne 0 ]; then cat out-v8/evidence/ADB_INSTALL.txt; exit "$install_rc"; fi
          "$ADB" shell pm clear "$PKG" > out-v8/evidence/PM_CLEAR.txt 2>&1 || true
          "$ADB" shell am force-stop "$PKG" || true
          "$ADB" logcat -c || true
          "$ADB" shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER "$PKG" | tee out-v8/evidence/RESOLVED_LAUNCHER.txt || true
          set +e
          "$ADB" shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 > out-v8/evidence/LAUNCH_COMMAND.txt 2>&1
          launch_rc=$?
          sleep 15
          "$ADB" shell pidof "$PKG" > out-v8/evidence/PID_AFTER_15S.txt 2>&1
          pid_rc=$?
          "$ADB" logcat -d -v threadtime > out-v8/evidence/LOGCAT_FULL.txt 2>&1
          "$ADB" shell dumpsys activity exit-info "$PKG" > out-v8/evidence/EXIT_INFO.txt 2>&1
          "$ADB" shell dumpsys activity activities > out-v8/evidence/ACTIVITIES.txt 2>&1
          set -e
          grep -E -i -C 20 'FATAL EXCEPTION|AndroidRuntime|Process: com.directive.v4|am_crash|crash|Exception|Error' out-v8/evidence/LOGCAT_FULL.txt > out-v8/evidence/LOGCAT_CRASH_FOCUS.txt || true
          if grep -Eq 'FATAL EXCEPTION|Process: com\.directive\.v4|am_crash' out-v8/evidence/LOGCAT_FULL.txt; then
            verdict=CRASH_REPRODUCED
          elif [ "$pid_rc" -eq 0 ]; then
            verdict=PROCESS_ALIVE_AFTER_15S
          else
            verdict=PROCESS_NOT_ALIVE_NO_FATAL_PATTERN
          fi
          printf 'launch_rc=%s\npid_rc=%s\nverdict=%s\n' "$launch_rc" "$pid_rc" "$verdict" | tee out-v8/evidence/RUNTIME_VERDICT.txt
          cat out-v8/evidence/LOGCAT_CRASH_FOCUS.txt || true
      - name: Upload runtime evidence and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE_4_ARM64_SOFTWARE_RUNTIME_v13
          path: |
            out-v8/DIRECTIVE_4_4.0.0_INSTALL_SAFE_TEST.apk
            out-v8/evidence/
          if-no-files-found: warn
          retention-days: 30
