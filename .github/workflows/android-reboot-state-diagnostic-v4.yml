name: DIRECTIVE Reboot State Diagnostic V4

on:
  push:
    paths:
      - '.github/workflows/android-reboot-state-diagnostic-v4.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: directive-reboot-state-diagnostic-v4
  cancel-in-progress: true

jobs:
  diagnostic:
    name: Diagnose package stopped state and boot reminder recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout controls
        uses: actions/checkout@v4

      - name: Download V3 proven Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: directive-final-exec002-convergence-v3
          path: prior
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33744984956

      - name: Verify V3 inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f prior/DIRECTIVE-1.0.0-debug.apk
          test -f prior/DIRECTIVE-1.0.0-androidTest.apk
          test -f prior/DIRECTIVE_EXEC002_FINAL_SOURCE.tar.gz
          echo '76afe150e3a6f0b1f68ee57fb08cadf51f98bf258b9b909c9b863805ad7e9c1d  prior/DIRECTIVE_EXEC002_FINAL_SOURCE.tar.gz' | sha256sum -c -
          mkdir -p artifact
          cp prior/DIRECTIVE-1.0.0-debug.apk artifact/
          cp prior/DIRECTIVE-1.0.0-androidTest.apk artifact/

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'

      - name: Install API 37 emulator
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          IMAGE='system-images;android-37.0;google_apis;x86_64'
          sdkmanager 'platform-tools' 'emulator' "$IMAGE"
          echo no | avdmanager create avd --force --name directive-reboot-v4-api37 --package "$IMAGE"

      - name: Boot clean emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd directive-reboot-v4-api37 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect > artifact/EMULATOR_LOG.txt 2>&1 &
          adb wait-for-device
          boot=''
          for i in $(seq 1 180); do
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$boot" = '1' ] && break
            sleep 2
          done
          test "$boot" = '1'
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true

      - name: Install launch and discover runner
        shell: bash
        run: |
          set -euo pipefail
          adb install artifact/DIRECTIVE-1.0.0-debug.apk | tee artifact/CLEAN_INSTALL.txt
          adb install artifact/DIRECTIVE-1.0.0-androidTest.apk | tee artifact/ANDROIDTEST_INSTALL.txt
          adb shell pm grant com.example.directive.debug android.permission.POST_NOTIFICATIONS >/dev/null 2>&1 || true
          COMPONENT="$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.example.directive.debug | tail -n 1 | tr -d '\r')"
          test -n "$COMPONENT"
          printf '%s\n' "$COMPONENT" > artifact/LAUNCH_COMPONENT.txt
          adb shell am start -W -n "$COMPONENT" | tee artifact/INITIAL_LAUNCH.txt
          grep -q 'Status: ok' artifact/INITIAL_LAUNCH.txt
          adb shell pm list instrumentation | tr -d '\r' | tee artifact/INSTRUMENTATION_LIST.txt
          RUNNER="$(awk '/\(target=com.example.directive.debug\)/ {v=$1; sub(/^instrumentation:/,"",v); print v; exit}' artifact/INSTRUMENTATION_LIST.txt)"
          test -n "$RUNNER"
          printf '%s\n' "$RUNNER" > artifact/INSTRUMENTATION_COMPONENT.txt
          adb shell dumpsys package com.example.directive.debug > artifact/PACKAGE_DUMP_INITIAL.txt
          grep -n -B8 -A20 'ReminderRestoreReceiver' artifact/PACKAGE_DUMP_INITIAL.txt > artifact/RECEIVER_DECLARATION.txt || true
          grep -n -E 'stopped=|STOPPED|pkgFlags|flags=' artifact/PACKAGE_DUMP_INITIAL.txt > artifact/PACKAGE_STATE_INITIAL.txt || true

      - name: Seed future reminder and inspect target package state
        shell: bash
        run: |
          set -euo pipefail
          RUNNER="$(cat artifact/INSTRUMENTATION_COMPONENT.txt)"
          TEST='com.example.directive.DirectiveRebootReminderInstrumentedTest#seedFutureReminderForReboot'
          adb shell am instrument -w -e class "$TEST" "$RUNNER" | tee artifact/REBOOT_SEED.txt
          grep -Eq 'OK \(1 test\)' artifact/REBOOT_SEED.txt
          adb shell dumpsys package com.example.directive.debug > artifact/PACKAGE_DUMP_AFTER_SEED.txt
          grep -n -E 'stopped=|STOPPED|pkgFlags|flags=' artifact/PACKAGE_DUMP_AFTER_SEED.txt > artifact/PACKAGE_STATE_AFTER_SEED.txt || true
          adb shell ps -A | grep -F 'com.example.directive.debug' > artifact/PROCESS_AFTER_SEED.txt || true

      - name: Explicitly unstop application before reboot
        shell: bash
        run: |
          set -euo pipefail
          COMPONENT="$(cat artifact/LAUNCH_COMPONENT.txt)"
          adb logcat -c || true
          adb shell am start -W -n "$COMPONENT" | tee artifact/PRE_REBOOT_EXPLICIT_LAUNCH.txt
          grep -q 'Status: ok' artifact/PRE_REBOOT_EXPLICIT_LAUNCH.txt
          sleep 3
          adb shell dumpsys package com.example.directive.debug > artifact/PACKAGE_DUMP_PRE_REBOOT.txt
          grep -n -E 'stopped=|STOPPED|pkgFlags|flags=' artifact/PACKAGE_DUMP_PRE_REBOOT.txt > artifact/PACKAGE_STATE_PRE_REBOOT.txt || true
          adb shell ps -A | grep -F 'com.example.directive.debug' > artifact/PROCESS_PRE_REBOOT.txt || true

      - name: Actual reboot then verify persisted reminder restoration
        shell: bash
        run: |
          set -euo pipefail
          RUNNER="$(cat artifact/INSTRUMENTATION_COMPONENT.txt)"
          adb reboot
          adb wait-for-device
          boot=''
          for i in $(seq 1 180); do
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$boot" = '1' ] && break
            sleep 2
          done
          test "$boot" = '1'
          sleep 15
          adb shell dumpsys package com.example.directive.debug > artifact/PACKAGE_DUMP_POST_REBOOT.txt
          grep -n -E 'stopped=|STOPPED|pkgFlags|flags=' artifact/PACKAGE_DUMP_POST_REBOOT.txt > artifact/PACKAGE_STATE_POST_REBOOT.txt || true
          adb shell ps -A | grep -F 'com.example.directive.debug' > artifact/PROCESS_POST_REBOOT.txt || true
          adb logcat -d -v time > artifact/POST_REBOOT_LOGCAT_FULL.txt
          grep -E 'ReminderRestoreReceiver|com.example.directive|BOOT_COMPLETED|PACKAGE_UNSTOPPED|WorkManager|AndroidRuntime|Hilt' artifact/POST_REBOOT_LOGCAT_FULL.txt > artifact/POST_REBOOT_LOGCAT_FILTERED.txt || true
          TEST='com.example.directive.DirectiveRebootReminderInstrumentedTest#verifyReminderRestoredAfterActualBoot'
          set +e
          adb shell am instrument -w -e class "$TEST" "$RUNNER" | tee artifact/REBOOT_RESTORE.txt
          rc=${PIPESTATUS[0]}
          set -e
          printf 'instrumentation_rc=%s\n' "$rc" > artifact/DIAGNOSTIC_RESULT.txt
          if grep -Eq 'OK \(1 test\)' artifact/REBOOT_RESTORE.txt && ! grep -q 'FAILURES!!!' artifact/REBOOT_RESTORE.txt; then
            echo 'REBOOT_RECOVERY_AFTER_EXPLICIT_UNSTOP=PASS' | tee -a artifact/DIAGNOSTIC_RESULT.txt
          else
            echo 'REBOOT_RECOVERY_AFTER_EXPLICIT_UNSTOP=FAIL' | tee -a artifact/DIAGNOSTIC_RESULT.txt
            exit 1
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directive-reboot-state-diagnostic-v4
          path: artifact/
          if-no-files-found: error
          retention-days: 30
