name: DIRECTIVE 5 Launcher Alias Runtime Fix v14

on:
  workflow_dispatch:
  push:
    branches: [directive2-github-build]
    paths:
      - 'support/patch_directive_launcher_alias_package.py'
      - 'support/directive5_launcher_alias_runtime_fix_build.sh'
      - '.github/workflows/directive5-launcher-alias-runtime-fix-v14.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build DIRECTIVE 5 from exact authoritative source
        shell: bash
        run: |
          set -euo pipefail
          bash support/directive5_launcher_alias_runtime_fix_build.sh
      - name: Verify D5 static acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          APK=out-v8/DIRECTIVE_5_5.0.0_INSTALL_SAFE_TEST.apk
          test -s "$APK"
          grep -Fq 'package: name=' out-v8/evidence/APK_BADGING.txt
          grep -Fq 'com.directive.v5' out-v8/evidence/APK_BADGING.txt
          grep -Fq "versionCode='8500'" out-v8/evidence/APK_BADGING.txt
          grep -Fq "versionName='5.0.0'" out-v8/evidence/APK_BADGING.txt
          if grep -Eq 'uses-permission: name=.android.permission.INTERNET' out-v8/evidence/APK_BADGING.txt; then
            echo 'FAIL: INTERNET permission present' >&2; exit 1
          fi
          grep -Fq 'final_go=false' out-v8/evidence/DIRECTIVE5_RUNTIME_FIX_STATUS.txt
          sha256sum "$APK"
      - name: Upload D5 APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE_5_ANDROID16_RUNTIME_FIX_CANDIDATE_v14
          path: |
            out-v8/DIRECTIVE_5_5.0.0_INSTALL_SAFE_TEST.apk
            out-v8/evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
