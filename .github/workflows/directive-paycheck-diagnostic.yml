name: DIRECTIVE PayCheck Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [directive-ci-build-05092026]
    paths:
      - '.github/workflows/directive-paycheck-diagnostic.yml'

permissions:
  contents: read

env:
  SOURCE_REPO: 3lacksun/-directive-v2-offline
  SOURCE_TAG: directive-v2-source-04092026
  SOURCE_ASSET_PATTERN: DIRECTIVE*UIUX_AUDITED_BUILD_READY_SOURCE_04092026175739-1.zip
  SOURCE_SHA256: 40f320d3155fa34a0c4965d3d6848edc5adb39811911d41f0ef36e9f5f78dbbb

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private source token
        env:
          PRIVATE_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Download frozen source
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input extracted diag
          gh release download "$SOURCE_TAG" --repo "$SOURCE_REPO" --pattern "$SOURCE_ASSET_PATTERN" --dir input
          SOURCE_DOWNLOADED="$(find input -maxdepth 1 -type f -name "$SOURCE_ASSET_PATTERN" -print -quit)"
          test -n "$SOURCE_DOWNLOADED"
          echo "$SOURCE_SHA256  $SOURCE_DOWNLOADED" | sha256sum -c -
          unzip -q "$SOURCE_DOWNLOADED" -d extracted
          ROOT="$(find extracted -type f -name apktool.yml -printf '%h\n' | head -n1)"
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Trace PayCheckHelper and offline account upsell
        shell: bash
        run: |
          set -euo pipefail
          OUT=diag/DIRECTIVE_PAYCHECK_DIAGNOSTIC.txt
          : > "$OUT"

          echo '=== PayCheckHelper classes ===' >> "$OUT"
          find "$ROOT" -path '*/com/ticktick/task/helper/pro/PayCheckHelper*.smali' -print >> "$OUT" || true
          for p in $(find "$ROOT" -path '*/com/ticktick/task/helper/pro/PayCheckHelper*.smali' -print); do
            echo "===== ${p#$ROOT/} =====" >> "$OUT"
            sed -n '1,2600p' "$p" >> "$OUT"
          done

          echo '=== Application-owned PayCheckHelper call sites ===' >> "$OUT"
          grep -R -n -E 'PayCheckHelper;->|PayCheckHelper\$' "$ROOT"/smali* --include='*.smali' \
            | grep '/com/ticktick/' | head -n 5000 >> "$OUT" || true

          echo '=== Billing/subscription/network call sites around startup ===' >> "$OUT"
          grep -R -n -i -E 'fetchCurrentSubscribeList|tryFetchInBlackList|billing|subscribe|subscription|PayPathRequestInterceptor' "$ROOT"/smali* --include='*.smali' \
            | grep '/com/ticktick/' | head -n 7000 >> "$OUT" || true

          echo '=== Empty-state cloud/account strings ===' >> "$OUT"
          grep -R -n -i -E 'Save your tasks to the cloud|Sign in now to use|Create Account|prevent your data from loss|cloud' "$ROOT/res" | head -n 3000 >> "$OUT" || true

          echo '=== Resource references for empty-state upsell IDs ===' >> "$OUT"
          grep -R -n -i -E 'btn_suggest|tv_summary|tv_title|empty.*login|login.*empty|create.*account|cloud' "$ROOT/res/values" "$ROOT/res/values-*" 2>/dev/null | head -n 4000 >> "$OUT" || true

          echo '=== Smali references to btn_suggest / account upsell ===' >> "$OUT"
          grep -R -n -i -E 'btn_suggest|Create Account|Save your tasks to the cloud|sign in now' "$ROOT"/smali* --include='*.smali' \
            | grep '/com/ticktick/' | head -n 4000 >> "$OUT" || true

          echo '=== V7EmptyViewLayout full class ===' >> "$OUT"
          V7="$(find "$ROOT" -path '*/com/ticktick/task/view/V7EmptyViewLayout.smali' -print -quit)"
          if [ -n "$V7" ]; then
            echo "===== ${V7#$ROOT/} =====" >> "$OUT"
            sed -n '1,2600p' "$V7" >> "$OUT"
          fi

          echo '=== EmptyViewLayout full class ===' >> "$OUT"
          EV="$(find "$ROOT" -path '*/com/ticktick/task/view/EmptyViewLayout.smali' -print -quit)"
          if [ -n "$EV" ]; then
            echo "===== ${EV#$ROOT/} =====" >> "$OUT"
            sed -n '1,2200p' "$EV" >> "$OUT"
          fi

          wc -c "$OUT"

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE-paycheck-diagnostic
          retention-days: 7
          path: diag/DIRECTIVE_PAYCHECK_DIAGNOSTIC.txt
