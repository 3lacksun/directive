name: Build DIRECTIVE APK

on:
  workflow_dispatch:
  push:
    branches: [directive-ci-build-05092026]
    paths:
      - '.github/workflows/build-directive.yml'
      - 'ci/DIRECTIVE_BUILD_TRIGGER/**'

permissions:
  contents: read

env:
  SOURCE_REPO: 3lacksun/-directive-v2-offline
  SOURCE_TAG: directive-v2-source-04092026
  SOURCE_ASSET_PATTERN: DIRECTIVE*UIUX_AUDITED_BUILD_READY_SOURCE_04092026175739-1.zip
  SOURCE_SHA256: 40f320d3155fa34a0c4965d3d6848edc5adb39811911d41f0ef36e9f5f78dbbb
  APKTOOL_VERSION: 2.12.1
  APKTOOL_SHA256: 66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa
  BUILD_TOOLS_VERSION: 35.0.0
  APPLICATION_ID: com.ticktick.task
  MIN_SDK: '21'
  TARGET_SDK: '37'
  PRIVATE_CANDIDATE_TAG: directive-ci-candidate
  PRIVATE_RELEASE_TAG: directive-ci-build-latest

jobs:
  build_x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout DIRECTIVE runner branch
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Require private DIRECTIVE source token
        env:
          PRIVATE_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Download authoritative DIRECTIVE source and build support
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input private-support extracted out
          gh release download "$SOURCE_TAG" --repo "$SOURCE_REPO" \
            --pattern "$SOURCE_ASSET_PATTERN" --dir input
          SOURCE_DOWNLOADED="$(find input -maxdepth 1 -type f -name "$SOURCE_ASSET_PATTERN" -print -quit)"
          test -n "$SOURCE_DOWNLOADED"
          mv "$SOURCE_DOWNLOADED" input/DIRECTIVE_AUTHORITATIVE_SOURCE.zip
          echo "$SOURCE_SHA256  input/DIRECTIVE_AUTHORITATIVE_SOURCE.zip" | sha256sum -c -

          for path in \
            support/prepare_directive_package.py \
            support/DIRECTIVE_TEST_SIGNING_KEYSTORE.b64 \
            .github/workflows/build-directive.yml; do
            name="$(basename "$path")"
            gh api "repos/$SOURCE_REPO/contents/$path?ref=main" --jq .content \
              | tr -d '\n' | base64 --decode > "private-support/$name"
          done

          unzip -q input/DIRECTIVE_AUTHORITATIVE_SOURCE.zip -d extracted
          FOUND_ROOT="$(find extracted -type f -name apktool.yml -printf '%h\n' | head -n 1)"
          test -n "$FOUND_ROOT"
          test -f "$FOUND_ROOT/AndroidManifest.xml"
          mv "$FOUND_ROOT" extracted/DIRECTIVE_SOURCE
          echo "SRC_ROOT=extracted/DIRECTIVE_SOURCE" >> "$GITHUB_ENV"

      - name: Apply DIRECTIVE identity icon and current Android SDK metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 private-support/prepare_directive_package.py "$SRC_ROOT" \
            | tee out/DIRECTIVE_PACKAGE_PREPARATION.txt
          cp "$SRC_ROOT/DIRECTIVE_PACKAGE_PREPARATION_REPORT.json" \
            out/DIRECTIVE_PACKAGE_PREPARATION_REPORT.json
          python3 - <<'PY'
          import json
          r=json.load(open('out/DIRECTIVE_PACKAGE_PREPARATION_REPORT.json'))
          v=r['verification']
          assert v['status']=='PASS', v
          assert v['min_sdk']=='21', v
          assert v['target_sdk']=='37', v
          print('PASS: DIRECTIVE package preparation')
          PY

      - name: Download verified Apktool and compile DIRECTIVE
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" \
            -o apktool.jar
          echo "$APKTOOL_SHA256  apktool.jar" | sha256sum -c -
          java -Xmx6g -jar apktool.jar b "$SRC_ROOT" -o out/DIRECTIVE_UNSIGNED.apk
          test -s out/DIRECTIVE_UNSIGNED.apk
          unzip -t out/DIRECTIVE_UNSIGNED.apk > out/DIRECTIVE_UNSIGNED_ZIP_TEST.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signer align and sign DIRECTIVE
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "build-tools;$BUILD_TOOLS_VERSION" platform-tools

          SIGNING_ALIAS="$(awk '/^[[:space:]]*SIGNING_ALIAS:/ {print $2; exit}' private-support/build-directive.yml)"
          SIGNING_STOREPASS="$(awk '/^[[:space:]]*SIGNING_STOREPASS:/ {print $2; exit}' private-support/build-directive.yml)"
          SIGNING_CERT_SHA256="$(awk '/^[[:space:]]*SIGNING_CERT_SHA256:/ {print $2; exit}' private-support/build-directive.yml)"
          test -n "$SIGNING_ALIAS"
          test -n "$SIGNING_STOREPASS"
          test -n "$SIGNING_CERT_SHA256"

          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          base64 --decode private-support/DIRECTIVE_TEST_SIGNING_KEYSTORE.b64 \
            > out/DIRECTIVE_TEST_SIGNING_KEYSTORE.keystore
          ACTUAL_CERT="$({
            keytool -exportcert \
              -keystore out/DIRECTIVE_TEST_SIGNING_KEYSTORE.keystore \
              -storepass "$SIGNING_STOREPASS" -alias "$SIGNING_ALIAS" -rfc
          } | openssl x509 -noout -fingerprint -sha256 | sed 's/.*=//;s/://g')"
          test "$ACTUAL_CERT" = "$SIGNING_CERT_SHA256"
          echo "DIRECTIVE signing certificate SHA-256: $ACTUAL_CERT" \
            > out/DIRECTIVE_SIGNING_CERT.txt

          "$BT/zipalign" -f -P 16 -v 4 \
            out/DIRECTIVE_UNSIGNED.apk out/DIRECTIVE_ALIGNED.apk \
            > out/DIRECTIVE_ZIPALIGN.txt
          "$BT/zipalign" -c -P 16 -v 4 out/DIRECTIVE_ALIGNED.apk \
            >> out/DIRECTIVE_ZIPALIGN.txt
          "$BT/apksigner" sign \
            --ks out/DIRECTIVE_TEST_SIGNING_KEYSTORE.keystore \
            --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass "pass:$SIGNING_STOREPASS" \
            --key-pass "pass:$SIGNING_STOREPASS" \
            --out out/DIRECTIVE_BUILD.apk out/DIRECTIVE_ALIGNED.apk
          "$BT/apksigner" verify --verbose --print-certs out/DIRECTIVE_BUILD.apk \
            | tee out/DIRECTIVE_APKSIGNER_VERIFY.txt
          "$BT/zipalign" -c -P 16 -v 4 out/DIRECTIVE_BUILD.apk \
            >> out/DIRECTIVE_ZIPALIGN.txt

      - name: Verify final DIRECTIVE binary branding SDK offline boundary and ABI
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          "$BT/aapt" dump badging out/DIRECTIVE_BUILD.apk | tee out/DIRECTIVE_AAPT_BADGING.txt
          "$BT/aapt" dump permissions out/DIRECTIVE_BUILD.apk | tee out/DIRECTIVE_AAPT_PERMISSIONS.txt

          grep -q "package: name='$APPLICATION_ID'" out/DIRECTIVE_AAPT_BADGING.txt
          grep -q "sdkVersion:'$MIN_SDK'" out/DIRECTIVE_AAPT_BADGING.txt
          grep -q "targetSdkVersion:'$TARGET_SDK'" out/DIRECTIVE_AAPT_BADGING.txt
          grep -q "application-label:'DIRECTIVE'" out/DIRECTIVE_AAPT_BADGING.txt
          grep -q 'directive_launcher' out/DIRECTIVE_AAPT_BADGING.txt

          if grep -Eqi "application-label[^:]*:'(TickTick|Directive V2)'" out/DIRECTIVE_AAPT_BADGING.txt; then
            echo 'FAIL: obsolete application branding remains' >&2
            exit 1
          fi
          if grep -Eqi 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE|CHANGE_WIFI_STATE)' out/DIRECTIVE_AAPT_PERMISSIONS.txt; then
            echo 'FAIL: DIRECTIVE contains forbidden network permission' >&2
            exit 1
          fi

          ABIS="$(unzip -Z1 out/DIRECTIVE_BUILD.apk | sed -n 's#^lib/\([^/]*\)/.*\.so$#\1#p' | sort -u | tr '\n' ' ')"
          echo "Native ABIs: ${ABIS:-none}" | tee out/DIRECTIVE_NATIVE_ABIS.txt
          grep -qw arm64-v8a <<<"$ABIS"
          sha256sum out/DIRECTIVE_BUILD.apk > out/DIRECTIVE_BUILD.apk.sha256

      - name: Stage signed DIRECTIVE candidate privately
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="DIRECTIVE_CANDIDATE_${GITHUB_RUN_ID}.apk"
          cp out/DIRECTIVE_BUILD.apk "out/$CANDIDATE"
          sha256sum "out/$CANDIDATE" > "out/$CANDIDATE.sha256"

          gh release view "$PRIVATE_CANDIDATE_TAG" --repo "$SOURCE_REPO" >/dev/null \
            || gh release create "$PRIVATE_CANDIDATE_TAG" --repo "$SOURCE_REPO" \
                 --title 'DIRECTIVE CI Candidate' \
                 --notes 'Private transient candidate used only for runtime acceptance.'

          gh release upload "$PRIVATE_CANDIDATE_TAG" \
            "out/$CANDIDATE" "out/$CANDIDATE.sha256" \
            out/DIRECTIVE_AAPT_BADGING.txt \
            out/DIRECTIVE_AAPT_PERMISSIONS.txt \
            out/DIRECTIVE_APKSIGNER_VERIFY.txt \
            out/DIRECTIVE_SIGNING_CERT.txt \
            out/DIRECTIVE_NATIVE_ABIS.txt \
            out/DIRECTIVE_PACKAGE_PREPARATION_REPORT.json \
            --repo "$SOURCE_REPO" --clobber

  runtime_android16:
    needs: build_x64
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Require private DIRECTIVE source token
        env:
          PRIVATE_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Download exact signed DIRECTIVE candidate and runtime verifier
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate runtime-support out
          CANDIDATE="DIRECTIVE_CANDIDATE_${GITHUB_RUN_ID}.apk"
          gh release download "$PRIVATE_CANDIDATE_TAG" --repo "$SOURCE_REPO" \
            --pattern "$CANDIDATE" --dir candidate
          gh api "repos/$SOURCE_REPO/contents/support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh?ref=main" \
            --jq .content | tr -d '\n' | base64 --decode \
            > runtime-support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh
          chmod +x runtime-support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh
          test -s "candidate/$CANDIDATE"
          echo "APK_PATH=candidate/$CANDIDATE" >> "$GITHUB_ENV"

      - name: Android 16 ARM64 clean-install offline cold-launch acceptance
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          APPLICATION_ID: ${{ env.APPLICATION_ID }}
          APK_PATH: ${{ env.APK_PATH }}
          TARGET_SDK: ${{ env.TARGET_SDK }}
        with:
          api-level: 36
          arch: arm64-v8a
          target: default
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 1200
          disable-animations: true
          script: bash runtime-support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh

      - name: Finalise timestamped DIRECTIVE release after runtime PASS
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TIMESTAMP="$(TZ=Europe/London date +'%d%m%Y%H%M%S')"
          FINAL_APK="DIRECTIVE_${TIMESTAMP}.apk"
          cp "$APK_PATH" "out/$FINAL_APK"
          shasum -a 256 "out/$FINAL_APK" > "out/$FINAL_APK.sha256"
          {
            echo 'Product: DIRECTIVE'
            echo "APK: $FINAL_APK"
            echo "Target SDK: $TARGET_SDK"
            echo "Source SHA-256: $SOURCE_SHA256"
            echo 'Android acceptance: API 36 / Android 16 / ARM64 / offline cold-launch + relaunch PASS'
          } > "out/DIRECTIVE_BUILD_METADATA_${TIMESTAMP}.txt"

          gh release view "$PRIVATE_RELEASE_TAG" --repo "$SOURCE_REPO" >/dev/null \
            || gh release create "$PRIVATE_RELEASE_TAG" --repo "$SOURCE_REPO" \
                 --title 'DIRECTIVE CI Build' \
                 --notes 'Android 16 ARM64 runtime-accepted offline DIRECTIVE APK.'

          gh release upload "$PRIVATE_RELEASE_TAG" \
            "out/$FINAL_APK" "out/$FINAL_APK.sha256" \
            "out/DIRECTIVE_BUILD_METADATA_${TIMESTAMP}.txt" \
            out/runtime/DIRECTIVE_RUNTIME_VERDICT.txt \
            out/runtime/DIRECTIVE_ANDROID_VERSION.txt \
            out/runtime/DIRECTIVE_ANDROID_API.txt \
            out/runtime/DIRECTIVE_DEVICE_ABI.txt \
            --repo "$SOURCE_REPO" --clobber

      - name: Preserve runtime diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE-runtime-failure-evidence
          retention-days: 7
          if-no-files-found: warn
          path: out/runtime/
