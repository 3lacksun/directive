name: DIRECTIVE 2 Project Build v2

on:
  push:
    branches: [directive2-github-build]
    paths:
      - 'DIRECTIVE2_SOURCE.json'
      - '.github/workflows/directive2-project-build-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TOOLS_VERSION: '35.0.0'
  ANDROID_PLATFORM: 'android-35'
  MIN_SDK: '21'
  EXPECTED_PACKAGE: 'com.directive.v2'
  EXPECTED_LABEL: 'DIRECTIVE 2'
  EXPECTED_VERSION_CODE: '8204'
  EXPECTED_VERSION_NAME: '2.0.4'

jobs:
  build:
    name: Build and verify DIRECTIVE 2 v2
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Validate source descriptor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('DIRECTIVE2_SOURCE.json'))
          for k in ('url','sha256','filename'):
              if not d.get(k): raise SystemExit(f'missing {k}')
          assert d['sha256']=='78263f9236855d40e522596f21630dd134e380c55d7f3a7814caedf5bfa4d3a3'
          assert d['filename']=='DIRECTIVE_2_APKBUILDER_1_1_0_PROJECT_09092026105600.zip'
          assert str(d['url']).startswith('https://github.com/3lacksun/directive/releases/download/')
          print('PASS: exact uploaded source descriptor')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android platform, build tools and smali
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;$ANDROID_PLATFORM" "build-tools;$BUILD_TOOLS_VERSION"
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y smali >/dev/null
          command -v smali
          smali --version || true

      - name: Download and verify exact project ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/source.env
          import json, shlex
          d=json.load(open('DIRECTIVE2_SOURCE.json'))
          print('SOURCE_URL='+shlex.quote(d['url']))
          print('SOURCE_SHA256='+shlex.quote(d['sha256']))
          PY
          source /tmp/source.env
          curl -fL --retry 5 --retry-delay 2 "$SOURCE_URL" -o source.zip
          echo "$SOURCE_SHA256  source.zip" | sha256sum -c -
          unzip -t source.zip > SOURCE_ZIP_TEST.txt
          rm -rf input
          mkdir input
          unzip -q source.zip -d input
          PROJECT_ROOT="$(python3 - <<'PY'
          from pathlib import Path
          candidates=[]
          for p in Path('input').rglob('AndroidManifest.xml'):
              root=p.parent
              if (root/'.project').is_file() and (root/'res').is_dir() and (root/'smali').is_dir():
                  candidates.append(root)
          if len(candidates)!=1:
              raise SystemExit(f'expected exactly one project root, found {len(candidates)}: {candidates}')
          print(candidates[0])
          PY
          )"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          printf 'PROJECT_ROOT=%s\n' "$PROJECT_ROOT"

      - name: Static source preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, os, re, json
          root=pathlib.Path(os.environ['PROJECT_ROOT'])
          manifest=(root/'AndroidManifest.xml').read_text(errors='replace')
          if 'package="com.directive.v2"' not in manifest: raise SystemExit('manifest package mismatch')
          for p in ['android.permission.INTERNET','android.permission.ACCESS_NETWORK_STATE','android.permission.ACCESS_WIFI_STATE','android.permission.CHANGE_NETWORK_STATE','android.permission.CHANGE_WIFI_STATE']:
              if p in manifest: raise SystemExit('forbidden network permission: '+p)
          for p in ['android.permission.READ_CALENDAR','android.permission.WRITE_CALENDAR']:
              if p not in manifest: raise SystemExit('missing calendar permission: '+p)
          if 'NAME=DIRECTIVE 2' not in (root/'.project').read_text(errors='replace'):
              raise SystemExit('.project identity mismatch')
          smali_dirs=[root/'smali',root/'smali_classes2',root/'smali_classes3',root/'smali_classes4',root/'smali_classes5']
          missing=[str(p.name) for p in smali_dirs if not p.is_dir()]
          if missing: raise SystemExit('missing inherited smali trees: '+', '.join(missing))
          java=list((root/'src').rglob('*.java'))
          if len(java)<6: raise SystemExit(f'expected >=6 DIRECTIVE Java sources, found {len(java)}')
          print('PASS: DIRECTIVE package/offline/calendar/multidex source preflight')
          PY

      - name: Assemble inherited multidex smali
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out/dex out/classes out/extdex out/evidence
          idx=1
          for d in smali smali_classes2 smali_classes3 smali_classes4 smali_classes5; do
            if [ "$idx" -eq 1 ]; then dex=classes.dex; else dex=classes${idx}.dex; fi
            echo "$d -> $dex"
            smali assemble "$PROJECT_ROOT/$d" -o "out/dex/$dex"
            test -s "out/dex/$dex"
            idx=$((idx+1))
          done
          echo "EXTENSION_DEX_INDEX=$idx" >> "$GITHUB_ENV"
          sha256sum out/dex/classes*.dex | tee out/evidence/INHERITED_DEX_SHA256.txt

      - name: Compile DIRECTIVE planner calendar reminder extension
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/$ANDROID_PLATFORM/android.jar"
          mapfile -t JAVA_FILES < <(find "$PROJECT_ROOT/src" -type f -name '*.java' | sort)
          javac -encoding UTF-8 -source 8 -target 8 -cp "$ANDROID_JAR" -d out/classes "${JAVA_FILES[@]}"
          jar cf out/DIRECTIVE_LOCAL_EXTENSION.jar -C out/classes .
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/d8" --lib "$ANDROID_JAR" --min-api "$MIN_SDK" --output out/extdex out/DIRECTIVE_LOCAL_EXTENSION.jar
          test -s out/extdex/classes.dex
          cp out/extdex/classes.dex "out/dex/classes${EXTENSION_DEX_INDEX}.dex"
          strings "out/dex/classes${EXTENSION_DEX_INDEX}.dex" | grep -Fq 'Lcom/directive/planner/DirectivePlannerActivity;'
          strings "out/dex/classes${EXTENSION_DEX_INDEX}.dex" | grep -Fq 'Lcom/directive/reminder/DirectivePersistentAlertService;'
          strings "out/dex/classes${EXTENSION_DEX_INDEX}.dex" | grep -Fq 'Lcom/directive/reminder/DirectivePersistentAlertStopReceiver;'
          echo 'PASS: local extension compiled' | tee out/evidence/EXTENSION_COMPILE.txt

      - name: Package resources assets native payload and dex
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          AAPT="$BT/aapt"
          ANDROID_JAR="$ANDROID_HOME/platforms/$ANDROID_PLATFORM/android.jar"
          EXTRA=''
          "$AAPT" 2>&1 | grep -q -- '--no-version-vectors' && EXTRA='--no-version-vectors' || true
          "$AAPT" package -f -I "$ANDROID_JAR" -M "$PROJECT_ROOT/AndroidManifest.xml" -S "$PROJECT_ROOT/res" -A "$PROJECT_ROOT/assets" -F out/DIRECTIVE_2_2.0.4-unsigned-unaligned.apk $EXTRA
          test -s out/DIRECTIVE_2_2.0.4-unsigned-unaligned.apk
          for f in out/dex/classes*.dex; do
            cp "$f" "$(basename "$f")"
            "$AAPT" add -f out/DIRECTIVE_2_2.0.4-unsigned-unaligned.apk "$(basename "$f")" >/dev/null
            rm "$(basename "$f")"
          done
          add_tree() {
            base="$1"
            [ -d "$PROJECT_ROOT/$base" ] || return 0
            (cd "$PROJECT_ROOT" && find "$base" -type f -print0 | while IFS= read -r -d '' f; do "$AAPT" add -f "$GITHUB_WORKSPACE/out/DIRECTIVE_2_2.0.4-unsigned-unaligned.apk" "$f" >/dev/null || exit 1; done)
          }
          add_tree lib
          add_tree kotlin
          add_tree META-INF
          if [ -d "$PROJECT_ROOT/unknown" ]; then
            (cd "$PROJECT_ROOT/unknown" && find . -type f -print0 | while IFS= read -r -d '' f; do rel="${f#./}"; "$AAPT" add -f "$GITHUB_WORKSPACE/out/DIRECTIVE_2_2.0.4-unsigned-unaligned.apk" "$rel" >/dev/null || true; done)
          fi
          unzip -t out/DIRECTIVE_2_2.0.4-unsigned-unaligned.apk > out/evidence/APK_ZIP_TEST.txt
          unzip -l out/DIRECTIVE_2_2.0.4-unsigned-unaligned.apk | grep -E 'classes[1-6]?\.dex' | tee out/evidence/APK_DEX_LIST.txt

      - name: Align test-sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          "$BT/zipalign" -f -P 16 4 out/DIRECTIVE_2_2.0.4-unsigned-unaligned.apk out/DIRECTIVE_2_2.0.4-aligned.apk
          "$BT/zipalign" -c -P 16 4 out/DIRECTIVE_2_2.0.4-aligned.apk | tee out/evidence/ZIPALIGN.txt
          keytool -genkeypair -noprompt -keystore out/directive2-github-test.jks -storepass android -keypass android -alias directive2github -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=DIRECTIVE 2 GitHub Test, O=NexaRenew, C=GB'
          "$BT/apksigner" sign --ks out/directive2-github-test.jks --ks-key-alias directive2github --ks-pass pass:android --key-pass pass:android --out out/DIRECTIVE_2_2.0.4_GITHUB_TEST.apk out/DIRECTIVE_2_2.0.4-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs out/DIRECTIVE_2_2.0.4_GITHUB_TEST.apk | tee out/evidence/APKSIGNER_VERIFY.txt
          "$BT/aapt" dump badging out/DIRECTIVE_2_2.0.4_GITHUB_TEST.apk | tee out/evidence/APK_BADGING.txt
          "$BT/aapt" dump permissions out/DIRECTIVE_2_2.0.4_GITHUB_TEST.apk | tee out/evidence/APK_PERMISSIONS.txt
          grep -Fq "package: name='com.directive.v2' versionCode='8204' versionName='2.0.4'" out/evidence/APK_BADGING.txt
          ! grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE|CHANGE_WIFI_STATE)' out/evidence/APK_PERMISSIONS.txt
          grep -Fq 'android.permission.READ_CALENDAR' out/evidence/APK_PERMISSIONS.txt
          grep -Fq 'android.permission.WRITE_CALENDAR' out/evidence/APK_PERMISSIONS.txt
          sha256sum out/DIRECTIVE_2_2.0.4_GITHUB_TEST.apk | tee out/evidence/SHA256SUMS.txt
          printf '%s\n' 'build=PASS' 'static_verification=PASS' 'signing=EPHEMERAL_GITHUB_TEST_KEY' 'android16_runtime=UNEXECUTED' 'physical_acceptance=UNEXECUTED' 'final_go=false' > out/evidence/BUILD_STATUS.txt

      - name: Upload APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE_2_2.0.4_GITHUB_TEST_v2
          path: |
            out/DIRECTIVE_2_2.0.4_GITHUB_TEST.apk
            out/evidence/
            SOURCE_ZIP_TEST.txt
          if-no-files-found: error
          retention-days: 30
