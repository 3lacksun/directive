name: DIRECTIVE Offline Path Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [directive-ci-build-05092026]
    paths:
      - '.github/workflows/directive-online-path-diagnostic.yml'

permissions:
  contents: read

env:
  SOURCE_REPO: 3lacksun/-directive-v2-offline
  SOURCE_TAG: directive-v2-source-04092026
  SOURCE_ASSET_PATTERN: DIRECTIVE*UIUX_AUDITED_BUILD_READY_SOURCE_04092026175739-1.zip
  SOURCE_SHA256: 40f320d3155fa34a0c4965d3d6848edc5adb39811911d41f0ef36e9f5f78dbbb

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private source token
        env:
          PRIVATE_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Download frozen source
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input extracted diag
          gh release download "$SOURCE_TAG" --repo "$SOURCE_REPO" --pattern "$SOURCE_ASSET_PATTERN" --dir input
          SOURCE_DOWNLOADED="$(find input -maxdepth 1 -type f -name "$SOURCE_ASSET_PATTERN" -print -quit)"
          test -n "$SOURCE_DOWNLOADED"
          echo "$SOURCE_SHA256  $SOURCE_DOWNLOADED" | sha256sum -c -
          unzip -q "$SOURCE_DOWNLOADED" -d extracted
          ROOT="$(find extracted -type f -name apktool.yml -printf '%h\n' | head -n1)"
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Trace application-owned Analytics startup
        shell: bash
        run: |
          set -euo pipefail
          OUT=diag/DIRECTIVE_OFFLINE_PATH_DIAGNOSTIC.txt
          : > "$OUT"
          echo '=== Application-owned references to Google Analytics classes ===' >> "$OUT"
          grep -R -n -E 'Lcom/google/android/gms/(analytics|internal/gtm)/' "$ROOT"/smali* --include='*.smali' \
            | grep -v '/com/google/android/gms/' | head -n 4000 >> "$OUT" || true
          echo '=== Direct GoogleAnalytics getInstance/newTracker/dispatch references ===' >> "$OUT"
          grep -R -n -E 'GoogleAnalytics;->|Tracker;->|AnalyticsReceiver|AnalyticsService|AnalyticsJobService|CampaignTracking' "$ROOT"/smali* --include='*.smali' \
            | grep -v '/com/google/android/gms/' | head -n 4000 >> "$OUT" || true
          echo '=== TickTick application analytics-labelled methods/classes ===' >> "$OUT"
          grep -R -n -i -E 'google.?analytics|analytics|tracking' "$ROOT"/smali* --include='*.smali' \
            | grep '/com/ticktick/' | head -n 5000 >> "$OUT" || true
          echo '=== DataTracker companion init method ===' >> "$OUT"
          python3 - "$ROOT" >> "$OUT" <<'PY'
          from pathlib import Path
          import re, sys
          root=Path(sys.argv[1])
          files=list(root.glob('smali*/com/ticktick/task/utils/DataTracker$Companion.smali'))
          if len(files)!=1:
              print('DataTracker companion count', len(files)); raise SystemExit(0)
          text=files[0].read_text('utf-8')
          for name in ('init','scheduleUpload','upload','sendActivationEvent'):
              rx=re.compile(r'(?ms)^\.method [^\n]*\b'+re.escape(name)+r'\([^\n]*?^\.end method$')
              ms=list(rx.finditer(text))
              print(f'--- {name}: {len(ms)} method(s) ---')
              for m in ms: print(m.group(0)[:20000])
          PY
          echo '=== Manifest analytics components ===' >> "$OUT"
          grep -n -i -E 'analytics|measurement|campaign' "$ROOT/AndroidManifest.xml" >> "$OUT" || true
          wc -c "$OUT"

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE-offline-path-diagnostic
          retention-days: 7
          path: diag/DIRECTIVE_OFFLINE_PATH_DIAGNOSTIC.txt
