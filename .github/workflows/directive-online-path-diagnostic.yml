name: DIRECTIVE Offline Path Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [directive-ci-build-05092026]
    paths:
      - '.github/workflows/directive-online-path-diagnostic.yml'

permissions:
  contents: read

env:
  SOURCE_REPO: 3lacksun/-directive-v2-offline
  SOURCE_TAG: directive-v2-source-04092026
  SOURCE_ASSET_PATTERN: DIRECTIVE*UIUX_AUDITED_BUILD_READY_SOURCE_04092026175739-1.zip
  SOURCE_SHA256: 40f320d3155fa34a0c4965d3d6848edc5adb39811911d41f0ef36e9f5f78dbbb

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private source token
        env:
          PRIVATE_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Download frozen source
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input extracted diag
          gh release download "$SOURCE_TAG" --repo "$SOURCE_REPO" --pattern "$SOURCE_ASSET_PATTERN" --dir input
          SOURCE_DOWNLOADED="$(find input -maxdepth 1 -type f -name "$SOURCE_ASSET_PATTERN" -print -quit)"
          test -n "$SOURCE_DOWNLOADED"
          echo "$SOURCE_SHA256  $SOURCE_DOWNLOADED" | sha256sum -c -
          unzip -q "$SOURCE_DOWNLOADED" -d extracted
          ROOT="$(find extracted -type f -name apktool.yml -printf '%h\n' | head -n1)"
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Capture obsolete online-era paths
        shell: bash
        run: |
          set -euo pipefail
          OUT=diag/DIRECTIVE_OFFLINE_PATH_DIAGNOSTIC.txt
          : > "$OUT"
          for rel in \
            smali_classes2/l8/o.smali \
            smali_classes2/l8/o\$a.smali \
            smali_classes4/com/ticktick/task/utils/Utils.smali \
            smali_classes4/com/ticktick/task/utils/DataTracker\$Companion.smali; do
            f="$ROOT/$rel"
            echo "=== FILE: $rel ===" >> "$OUT"
            test -f "$f"
            cat "$f" >> "$OUT"
            echo >> "$OUT"
          done
          echo '=== UserCountryDecider call sites ===' >> "$OUT"
          grep -R -n -E 'Ll8/o;|Ll8/o\$a;' "$ROOT"/smali* --include='*.smali' >> "$OUT" || true
          echo '=== DataTracker init/call sites ===' >> "$OUT"
          grep -R -n -E 'DataTracker\$Companion;->(init|sendActivationEvent|upload)|DataTracker;->' "$ROOT"/smali* --include='*.smali' >> "$OUT" || true
          echo '=== connectivity and config sync call sites ===' >> "$OUT"
          grep -R -n -E 'Utils;->isInNetwork|ConfigCore;->allowSync|PreferenceManager;->sync|AppConfigWorker' "$ROOT"/smali* --include='*.smali' >> "$OUT" || true
          wc -c "$OUT"

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE-offline-path-diagnostic
          retention-days: 7
          path: diag/DIRECTIVE_OFFLINE_PATH_DIAGNOSTIC.txt
