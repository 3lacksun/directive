name: DIRECTIVE Offline Path Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [directive-ci-build-05092026]
    paths:
      - '.github/workflows/directive-online-path-diagnostic.yml'

permissions:
  contents: read

env:
  SOURCE_REPO: 3lacksun/-directive-v2-offline
  SOURCE_TAG: directive-v2-source-04092026
  SOURCE_ASSET_PATTERN: DIRECTIVE*UIUX_AUDITED_BUILD_READY_SOURCE_04092026175739-1.zip
  SOURCE_SHA256: 40f320d3155fa34a0c4965d3d6848edc5adb39811911d41f0ef36e9f5f78dbbb

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private source token
        env:
          PRIVATE_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Download frozen source
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input extracted diag
          gh release download "$SOURCE_TAG" --repo "$SOURCE_REPO" --pattern "$SOURCE_ASSET_PATTERN" --dir input
          SOURCE_DOWNLOADED="$(find input -maxdepth 1 -type f -name "$SOURCE_ASSET_PATTERN" -print -quit)"
          test -n "$SOURCE_DOWNLOADED"
          echo "$SOURCE_SHA256  $SOURCE_DOWNLOADED" | sha256sum -c -
          unzip -q "$SOURCE_DOWNLOADED" -d extracted
          ROOT="$(find extracted -type f -name apktool.yml -printf '%h\n' | head -n1)"
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Capture obsolete online-era paths
        shell: bash
        run: |
          set -euo pipefail
          OUT=diag/DIRECTIVE_OFFLINE_PATH_DIAGNOSTIC.txt
          : > "$OUT"
          echo '=== Google Analytics / GAv4 / analytics identifiers ===' >> "$OUT"
          grep -R -n -i -E 'google[._ ]?analytics|GAv4|analytics|Tracker|Measurement|CampaignTracking|AnalyticsReceiver|AnalyticsService' "$ROOT"/smali* "$ROOT/AndroidManifest.xml" "$ROOT/res" --include='*.smali' --include='*.xml' 2>/dev/null | head -n 4000 >> "$OUT" || true
          echo '=== ACCESS_NETWORK_STATE references ===' >> "$OUT"
          grep -R -n -E 'ACCESS_NETWORK_STATE|ConnectivityManager;->getActiveNetworkInfo' "$ROOT"/smali* "$ROOT/AndroidManifest.xml" --include='*.smali' --include='*.xml' 2>/dev/null | head -n 2000 >> "$OUT" || true
          echo '=== analytics package/class inventory ===' >> "$OUT"
          find "$ROOT" -type f \( -path '*google/android/gms/analytics*' -o -path '*analytics*' \) -print | sort | head -n 3000 >> "$OUT" || true
          echo '=== Manifest analytics components ===' >> "$OUT"
          grep -n -i -E 'analytics|measurement|campaign' "$ROOT/AndroidManifest.xml" >> "$OUT" || true
          echo '=== Existing offline cleanup targets ===' >> "$OUT"
          grep -R -n -E 'DataTracker\$Companion;->(init|sendActivationEvent|upload)|Utils;->isInNetwork|Ll8/o;|Ll8/o\$a;' "$ROOT"/smali* --include='*.smali' | head -n 2000 >> "$OUT" || true
          wc -c "$OUT"

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE-offline-path-diagnostic
          retention-days: 7
          path: diag/DIRECTIVE_OFFLINE_PATH_DIAGNOSTIC.txt
