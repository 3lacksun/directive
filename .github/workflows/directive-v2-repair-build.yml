name: Directive V2 Runtime-Compatible APK Build

on:
  workflow_dispatch:
  push:
    branches: [directive-v2-ci-probe-04092026]
    paths:
      - '.github/workflows/directive-v2-repair-build.yml'
      - 'ci/directive-v2-repair-trigger/**'

permissions:
  contents: read

env:
  SOURCE_REPO: 3lacksun/-directive-v2-offline
  SOURCE_TAG: directive-v2-source-04092026
  SOURCE_ASSET: DIRECTIVE_V2_UIUX_AUDITED_BUILD_READY_SOURCE_04092026175739-1.zip
  SOURCE_SHA256: 40f320d3155fa34a0c4965d3d6848edc5adb39811911d41f0ef36e9f5f78dbbb
  APKTOOL_VERSION: 2.12.1
  APKTOOL_SHA256: 66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa
  BUILD_TOOLS_VERSION: 35.0.0
  APPLICATION_ID: com.ticktick.task

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Require private-source token
        env:
          PRIVATE_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Download authoritative source and repair support
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input private-support extracted out
          gh release download "$SOURCE_TAG" --repo "$SOURCE_REPO" --pattern "$SOURCE_ASSET" --dir input
          echo "$SOURCE_SHA256  input/$SOURCE_ASSET" | sha256sum -c -
          for path in support/prepare_isolated_package.py support/directive-v2-local-test-keystore.b64 .github/workflows/build-directive-v2.yml; do
            name="$(basename "$path")"
            gh api "repos/$SOURCE_REPO/contents/$path?ref=main" --jq .content | tr -d '\n' | base64 --decode > "private-support/$name"
          done
          unzip -q "input/$SOURCE_ASSET" -d extracted
          SRC_ROOT="$(find extracted -type f -name apktool.yml -printf '%h\n' | head -n 1)"
          test -n "$SRC_ROOT"
          test -f "$SRC_ROOT/AndroidManifest.xml"
          echo "SRC_ROOT=$SRC_ROOT" >> "$GITHUB_ENV"

      - name: Preserve proven package identity and add Android 16-compatible SDK metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 private-support/prepare_isolated_package.py "$SRC_ROOT" | tee out/package-preparation.txt
          cp "$SRC_ROOT/DIRECTIVE_V2_PACKAGE_MIGRATION_REPORT.json" out/
          python3 - <<'PY'
          import json
          r=json.load(open('out/DIRECTIVE_V2_PACKAGE_MIGRATION_REPORT.json'))
          v=r['verification']
          assert v['status']=='PASS', v
          assert v['package']=='com.ticktick.task', v
          assert v['min_sdk']=='24', v
          assert v['target_sdk']=='24', v
          print('PASS runtime-compatible package preparation')
          PY

      - name: Download verified Apktool and compile
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" -o apktool.jar
          echo "$APKTOOL_SHA256  apktool.jar" | sha256sum -c -
          java -Xmx6g -jar apktool.jar b "$SRC_ROOT" -o out/directive-v2-unsigned.apk
          test -s out/directive-v2-unsigned.apk
          unzip -t out/directive-v2-unsigned.apk > out/unsigned-zip-test.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore stable signer, align and sign
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "build-tools;$BUILD_TOOLS_VERSION" platform-tools
          SIGNING_ALIAS="$(awk '/^[[:space:]]*SIGNING_ALIAS:/ {print $2; exit}' private-support/build-directive-v2.yml)"
          SIGNING_STOREPASS="$(awk '/^[[:space:]]*SIGNING_STOREPASS:/ {print $2; exit}' private-support/build-directive-v2.yml)"
          SIGNING_CERT_SHA256="$(awk '/^[[:space:]]*SIGNING_CERT_SHA256:/ {print $2; exit}' private-support/build-directive-v2.yml)"
          test -n "$SIGNING_ALIAS"; test -n "$SIGNING_STOREPASS"; test -n "$SIGNING_CERT_SHA256"
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          base64 --decode private-support/directive-v2-local-test-keystore.b64 > out/directive-v2-local-test.keystore
          ACTUAL_CERT="$({ keytool -exportcert -keystore out/directive-v2-local-test.keystore -storepass "$SIGNING_STOREPASS" -alias "$SIGNING_ALIAS" -rfc; } | openssl x509 -noout -fingerprint -sha256 | sed 's/.*=//;s/://g')"
          test "$ACTUAL_CERT" = "$SIGNING_CERT_SHA256"
          echo "Signing certificate SHA-256: $ACTUAL_CERT" > out/signing-cert.txt
          "$BT/zipalign" -f -P 16 -v 4 out/directive-v2-unsigned.apk out/directive-v2-aligned.apk > out/zipalign.txt
          "$BT/zipalign" -c -P 16 -v 4 out/directive-v2-aligned.apk >> out/zipalign.txt
          "$BT/apksigner" sign --ks out/directive-v2-local-test.keystore --ks-key-alias "$SIGNING_ALIAS" --ks-pass "pass:$SIGNING_STOREPASS" --key-pass "pass:$SIGNING_STOREPASS" --out out/Directive-V2-runtime-compatible.apk out/directive-v2-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs out/Directive-V2-runtime-compatible.apk | tee out/apksigner-verify.txt
          "$BT/zipalign" -c -P 16 -v 4 out/Directive-V2-runtime-compatible.apk >> out/zipalign.txt

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          "$BT/aapt" dump badging out/Directive-V2-runtime-compatible.apk | tee out/aapt-badging.txt
          "$BT/aapt" dump permissions out/Directive-V2-runtime-compatible.apk | tee out/aapt-permissions.txt
          grep -q "package: name='$APPLICATION_ID'" out/aapt-badging.txt
          grep -q "sdkVersion:'24'" out/aapt-badging.txt
          grep -q "targetSdkVersion:'24'" out/aapt-badging.txt
          grep -q "application-label:'Directive V2'" out/aapt-badging.txt
          if grep -Eqi 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE|CHANGE_WIFI_STATE)' out/aapt-permissions.txt; then
            echo 'FAIL forbidden network permission' >&2
            exit 1
          fi
          ABIS="$(unzip -Z1 out/Directive-V2-runtime-compatible.apk | sed -n 's#^lib/\([^/]*\)/.*\.so$#\1#p' | sort -u | tr '\n' ' ')"
          echo "Native ABIs: ${ABIS:-none}" | tee out/native-abis.txt
          if [ -n "$ABIS" ] && ! grep -qw arm64-v8a <<<"$ABIS"; then exit 1; fi
          sha256sum out/Directive-V2-runtime-compatible.apk | tee out/Directive-V2-runtime-compatible.apk.sha256

      - name: Upload runtime-compatible APK
        uses: actions/upload-artifact@v4
        with:
          name: directive-v2-runtime-compatible-apk
          retention-days: 30
          if-no-files-found: error
          path: |
            out/Directive-V2-runtime-compatible.apk
            out/Directive-V2-runtime-compatible.apk.sha256
            out/aapt-badging.txt
            out/aapt-permissions.txt
            out/apksigner-verify.txt
            out/signing-cert.txt
            out/native-abis.txt
            out/zipalign.txt
            out/DIRECTIVE_V2_PACKAGE_MIGRATION_REPORT.json
