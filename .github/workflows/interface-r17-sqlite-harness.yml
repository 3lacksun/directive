name: INTERFACE R17.1 SQLite Harness
on:
  push:
    branches: [interface-r17-sqlite-harness]
  workflow_dispatch:
jobs:
  sqlite-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP SQLite runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 unzip curl python3-pip
          python3 -m pip install --user gdown --break-system-packages
          php -v
          php -m | grep -Ei 'PDO|sqlite'
      - name: Fetch authoritative deployment candidate
        run: |
          mkdir -p interface-harness
          cd interface-harness
          python3 -m gdown 'https://drive.google.com/uc?id=1H1sM9ojq-2rFi4oMzRwqTvxstcF15ApW' -O candidate.zip
          sha256sum candidate.zip
          echo 'e88d039ae798039c688e0522c15ecc5f37e22084b41da9097cc7d5970aa31489  candidate.zip' | sha256sum -c -
          unzip -q candidate.zip -d app
      - name: Create acceptance harness
        run: |
          cat > interface-harness/harness.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=__DIR__.'/app';
          chdir($root);
          require_once $root.'/config.php';
          function fail_h(string $m): never { fwrite(STDERR,"FAIL: $m\n"); exit(1); }
          function assert_h(bool $c,string $m): void { if(!$c) fail_h($m); echo "PASS: $m\n"; }
          function fresh_pdo(string $path): PDO {
              @unlink($path);
              $p=new PDO('sqlite:'.$path,null,null,[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
              create_schema($p); authv2_install_schema($p); return $p;
          }
          function seed_user(PDO $p,string $id,string $role='user'): void {
              $p->prepare("INSERT INTO users(id,username,password_hash,role,permissions,disabled,email,display_name,force_password_change,session_version,created_at,last_login_at,account_state,auth_version) VALUES(?,?,?,?, '{}',0,'',?,0,1,datetime('now'),NULL,'active',4)")
                ->execute([$id,$id,'x',$role,$id]);
          }
          $tmp=sys_get_temp_dir().'/interface-r17-harness-'.bin2hex(random_bytes(4)); mkdir($tmp,0777,true);
          foreach([0,1,2] as $n){
              $p=fresh_pdo($tmp.'/mig'.$n.'.sqlite');
              for($i=1;$i<=$n;$i++) seed_user($p,'u'.$i);
              r17_migrate_schema($p);
              $state=r17_managed_user_state($p);
              if($n===0){assert_h($state['state']==='unassigned' && $state['count']===0,'R16→R17 migration zero-user case');}
              if($n===1){assert_h($state['state']==='assigned' && $state['count']===1 && ($state['managed_user']['id']??'')==='u1','R16→R17 migration one-user case');}
              if($n===2){assert_h($state['state']==='selection_required' && $state['count']===2 && !empty($state['selection_required']),'R16→R17 migration multi-user case');}
              assert_h((int)$p->query("SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('assistant_rules','assistant_rule_versions','memory_exclusions','help_requests')")->fetchColumn()===4,'R17 tables exist for migration case '.$n);
          }
          ensure_dirs();
          @unlink(DB_FILE);
          $pdo=new PDO('sqlite:'.DB_FILE,null,null,[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
          create_schema($pdo); authv2_install_schema($pdo); r17_migrate_schema($pdo);
          seed_user($pdo,'admin','admin'); seed_user($pdo,'managed','user'); r17_reconcile_managed_user_state($pdo);
          $pdo->prepare("INSERT INTO assistant_rules(user_id,version_no,content,created_at,updated_at) VALUES('managed',1,'Keep answers concise',datetime('now'),datetime('now'))")->execute();
          $pdo->prepare("INSERT INTO memories(id,user_id,content,scope,enabled,memory_type,source_type,source_id,importance,metadata,confidence,evidence_count,first_observed_at,last_observed_at,automatic,pinned,supersedes_id,superseded_by_id,fingerprint,created_at,updated_at) VALUES('m1','managed','Prefers concise answers','global',1,'preference','manual','',5,'{}',0.9,1,datetime('now'),datetime('now'),0,1,NULL,NULL,?,datetime('now'),datetime('now'))")->execute([r17_memory_fingerprint('Prefers concise answers')]);
          $GLOBALS['__llmf_pdo']=$pdo;
          $backup=create_server_backup('admin');
          assert_h(!empty($backup['id']),'R17 backup created');
          $backupId=(string)$backup['id'];
          $pdo->exec("UPDATE assistant_rules SET content='CORRUPTED' WHERE user_id='managed'");
          $pdo->exec("DELETE FROM memories WHERE id='m1'");
          close_db_connection();
          $restored=restore_server_backup($backupId,false);
          assert_h(is_array($restored),'R17 restore completed');
          $check=new PDO('sqlite:'.DB_FILE,null,null,[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
          assert_h((string)$check->query("SELECT content FROM assistant_rules WHERE user_id='managed'")->fetchColumn()==='Keep answers concise','R17 assistant rules round-trip');
          assert_h((int)$check->query("SELECT COUNT(*) FROM memories WHERE id='m1' AND user_id='managed'")->fetchColumn()===1,'R17 memory round-trip');
          assert_h(strtolower((string)$check->query('PRAGMA integrity_check')->fetchColumn())==='ok','R17 restored SQLite integrity');
          assert_h(count($check->query('PRAGMA foreign_key_check')->fetchAll())===0,'R17 restored foreign-key integrity');
          echo "HARNESS_RESULT=PASS\n";
          PHP
      - name: Run PHP/PDO SQLite acceptance harness
        run: php interface-harness/harness.php | tee interface-harness/result.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-r17-sqlite-harness-evidence
          path: |
            interface-harness/result.txt
            interface-harness/harness.php
