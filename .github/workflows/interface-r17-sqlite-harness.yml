name: INTERFACE R17.1 SQLite Harness Runtime
on:
  push:
    branches: [interface-r17-sqlite-harness]
  workflow_dispatch:
jobs:
  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.4 with SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, openssl
          coverage: none
      - name: Verify and collect runtime
        shell: bash
        run: |
          set -euxo pipefail
          php -v
          php -m | grep -Ei 'PDO|pdo_sqlite|sqlite3'
          EXT_DIR="$(php -r 'echo ini_get("extension_dir");')"
          mkdir -p runtime/extensions
          cp "$EXT_DIR/pdo_sqlite.so" runtime/extensions/
          cp "$EXT_DIR/sqlite3.so" runtime/extensions/
          php -r 'echo PHP_VERSION,"\n",PHP_ZTS?"ZTS\n":"NTS\n",PHP_DEBUG?"DEBUG\n":"NODEBUG\n",PHP_EXTENSION_DIR,"\n";' > runtime/php-build.txt
          ldd "$EXT_DIR/pdo_sqlite.so" > runtime/pdo_sqlite.ldd.txt
          ldd "$EXT_DIR/sqlite3.so" > runtime/sqlite3.ldd.txt
          sha256sum runtime/extensions/*.so > runtime/SHA256SUMS.txt
      - name: Upload PHP SQLite runtime
        uses: actions/upload-artifact@v4
        with:
          name: interface-php84-sqlite-runtime
          path: runtime/
