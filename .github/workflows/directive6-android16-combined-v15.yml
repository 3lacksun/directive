name: DIRECTIVE 6 Android 16 Combined v15

on:
  push:
    branches: [directive2-github-build]
    paths:
      - 'support/directive6_android16_combined_runtime_build.sh'
      - 'support/patch_directive_android16_startup_hardening.py'
      - 'support/patch_directive_fixed_launcher_runtime.py'
      - '.github/workflows/directive6-android16-combined-v15.yml'
      - 'DIRECTIVE2_SOURCE.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify DIRECTIVE 6 combined Android 16 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Execute combined runtime build
        shell: bash
        run: |
          python3 -m py_compile \
            support/patch_directive_android16_startup_hardening.py \
            support/patch_directive_fixed_launcher_runtime.py \
            support/patch_directive_runtime_package_identity.py \
            support/patch_directive_launcher_identity.py
          chmod +x support/directive6_android16_combined_runtime_build.sh
          support/directive6_android16_combined_runtime_build.sh
      - name: Upload APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE_6_6.0.0_ANDROID16_COMBINED_v15
          path: |
            out-v8/DIRECTIVE_6_6.0.0_INSTALL_SAFE_TEST.apk
            out-v8/evidence/
          if-no-files-found: error
          retention-days: 30
