name: DIRECTIVE 2 Stable Signing Secret Scope Probe

on:
  push:
    branches: [directive2-github-build]
    paths:
      - '.github/workflows/directive2-secret-scope-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SIGNING_STORE_PASSWORD: ${{ secrets.DIRECTIVE_SIGNING_STORE_PASSWORD }}
      SOURCE_READ_TOKEN: ${{ secrets.DIRECTIVE_SOURCE_READ_TOKEN }}
    steps:
      - name: Check stable-signing prerequisites without exposing values
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SIGNING_STORE_PASSWORD:-}" ]; then echo 'DIRECTIVE_SIGNING_STORE_PASSWORD=AVAILABLE'; else echo 'DIRECTIVE_SIGNING_STORE_PASSWORD=MISSING'; fi
          if [ -n "${SOURCE_READ_TOKEN:-}" ]; then echo 'DIRECTIVE_SOURCE_READ_TOKEN=AVAILABLE'; else echo 'DIRECTIVE_SOURCE_READ_TOKEN=MISSING'; fi
          test -n "${SIGNING_STORE_PASSWORD:-}"
          test -n "${SOURCE_READ_TOKEN:-}"
