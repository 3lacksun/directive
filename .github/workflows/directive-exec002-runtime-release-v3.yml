name: DIRECTIVE EXEC002 Runtime Release v3

on:
  workflow_dispatch:
  push:
    branches: [directive-ci-build-05092026]
    paths:
      - '.github/workflows/directive-exec002-runtime-release-v3.yml'
      - 'ci/DIRECTIVE_EXEC002_RUNTIME_RELEASE_V3_TRIGGER/**'

permissions:
  contents: read
  actions: read

env:
  SOURCE_REPO: 3lacksun/-directive-v2-offline
  STATIC_RUN_ID: '34054145179'
  STATIC_ARTIFACT: DIRECTIVE-EXEC002-static-complete-v3
  STATIC_CANDIDATE_SHA256: e9f9bdbc7cfb85ba31378c364bd87a0f9d7ee4b1967c84dd176b78d4b37fa7cc
  SIGNED_RUN_ID: '34055914688'
  SIGNED_ARTIFACT: DIRECTIVE-EXEC002-signed-candidate
  SIGNED_APK_SHA256: 0d46bfde21818e2107b2a2dc389200547e238c5312c36e7542814284c9b0b423
  APPLICATION_ID: com.ticktick.task
  MIN_SDK: '21'
  TARGET_SDK: '37'
  INSTALL_ABI: arm64-v8a
  PRIVATE_RELEASE_TAG: directive-exec002-latest

jobs:
  runtime_android16:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Download exact already-verified signed EXEC002 candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SIGNED_ARTIFACT }}
          path: signed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.SIGNED_RUN_ID }}

      - name: Verify signed candidate by sealed SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test -f signed/DIRECTIVE_EXEC002_SIGNED.apk
          ACTUAL="$(sha256sum signed/DIRECTIVE_EXEC002_SIGNED.apk | awk '{print $1}')"
          test "$ACTUAL" = "$SIGNED_APK_SHA256"
          grep -q '^STATIC_COMPLETION=PASS$' signed/DIRECTIVE_EXEC002_STATIC_COMPLETION.md
          grep -q '^PASS: signed EXEC002 binary identity, SDK, offline boundary, ABI and planner registration$' signed/DIRECTIVE_SIGNED_BINARY_VERDICT.txt
          printf '%s  DIRECTIVE_EXEC002_SIGNED.apk\n' "$ACTUAL" | tee signed/DIRECTIVE_EXEC002_SIGNED_RUNTIME_LOCK.sha256
          echo "APK_PATH=$PWD/signed/DIRECTIVE_EXEC002_SIGNED.apk" >> "$GITHUB_ENV"

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Fetch established runtime verifier and write EXEC002 feature smoke
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          mkdir -p runtime-support out/runtime
          gh api "repos/$SOURCE_REPO/contents/support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh?ref=main" --jq .content \
            | tr -d '\n' | base64 --decode > runtime-support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh
          cat > runtime-support/DIRECTIVE_EXEC002_FEATURE_SMOKE.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          adb shell input tap 70 210
          sleep 2
          for i in 1 2 3; do
            adb shell uiautomator dump /sdcard/DIRECTIVE_EXEC002_DRAWER.xml >/dev/null 2>&1 || true
            adb pull /sdcard/DIRECTIVE_EXEC002_DRAWER.xml out/runtime/DIRECTIVE_EXEC002_DRAWER.xml >/dev/null 2>&1 || true
            [ -s out/runtime/DIRECTIVE_EXEC002_DRAWER.xml ] && break
            sleep 2
          done
          grep -q 'text="Master Plan"' out/runtime/DIRECTIVE_EXEC002_DRAWER.xml
          python3 - <<'PY'
          import re,subprocess,xml.etree.ElementTree as ET
          root=ET.parse('out/runtime/DIRECTIVE_EXEC002_DRAWER.xml').getroot()
          node=next((n for n in root.iter('node') if n.attrib.get('text')=='Master Plan'),None)
          if node is None: raise SystemExit('Master Plan drawer entry not found')
          m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',node.attrib.get('bounds',''))
          if not m: raise SystemExit('Master Plan bounds unavailable')
          x1,y1,x2,y2=map(int,m.groups())
          subprocess.check_call(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)])
          PY
          sleep 4

          adb shell dumpsys activity activities > out/runtime/DIRECTIVE_MASTER_PLAN_ACTIVITIES.txt
          grep -q 'com.directive.planner.DirectivePlannerActivity' out/runtime/DIRECTIVE_MASTER_PLAN_ACTIVITIES.txt
          for i in 1 2 3; do
            adb shell uiautomator dump /sdcard/DIRECTIVE_MASTER_PLAN.xml >/dev/null 2>&1 || true
            adb pull /sdcard/DIRECTIVE_MASTER_PLAN.xml out/runtime/DIRECTIVE_MASTER_PLAN.xml >/dev/null 2>&1 || true
            [ -s out/runtime/DIRECTIVE_MASTER_PLAN.xml ] && break
            sleep 2
          done
          grep -q 'text="Default duration"' out/runtime/DIRECTIVE_MASTER_PLAN.xml
          grep -q 'text="Bulk duration"' out/runtime/DIRECTIVE_MASTER_PLAN.xml
          adb exec-out screencap -p > out/runtime/DIRECTIVE_MASTER_PLAN.png

          python3 - <<'PY'
          import re,subprocess,xml.etree.ElementTree as ET
          root=ET.parse('out/runtime/DIRECTIVE_MASTER_PLAN.xml').getroot()
          node=next((n for n in root.iter('node') if n.attrib.get('text')=='Default duration'),None)
          if node is None: raise SystemExit('Default duration control not found')
          m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',node.attrib.get('bounds',''))
          if not m: raise SystemExit('Default duration bounds unavailable')
          x1,y1,x2,y2=map(int,m.groups())
          subprocess.check_call(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)])
          PY
          sleep 2
          adb shell uiautomator dump /sdcard/DIRECTIVE_DURATION_CHOOSER.xml >/dev/null 2>&1
          adb pull /sdcard/DIRECTIVE_DURATION_CHOOSER.xml out/runtime/DIRECTIVE_DURATION_CHOOSER.xml >/dev/null 2>&1
          for token in '15 min' '30 min' '45 min' '1 hr' '1.5 hr' '2 hr' 'Custom…'; do
            grep -Fq "text=\"$token\"" out/runtime/DIRECTIVE_DURATION_CHOOSER.xml
          done
          adb exec-out screencap -p > out/runtime/DIRECTIVE_DURATION_CHOOSER.png
          adb shell input keyevent KEYCODE_BACK

          PID="$(adb shell pidof "$APPLICATION_ID" | tr -d '\r' || true)"
          test -n "$PID"
          adb logcat -d -v threadtime > out/runtime/DIRECTIVE_MASTER_PLAN_LOGCAT.txt || true
          python3 - <<'PY'
          import os
          pkg=os.environ['APPLICATION_ID']
          lines=open('out/runtime/DIRECTIVE_MASTER_PLAN_LOGCAT.txt',errors='ignore').read().splitlines()
          hits=[]
          for i,line in enumerate(lines):
              if 'FATAL EXCEPTION' not in line and 'Fatal signal' not in line:
                  continue
              block='\n'.join(lines[max(0,i-5):min(len(lines),i+90)])
              if pkg in block:
                  hits.append(block)
          open('out/runtime/DIRECTIVE_MASTER_PLAN_CRASH_CONTEXT.txt','w').write('\n\n---\n\n'.join(hits))
          if hits:
              raise SystemExit('DIRECTIVE Master Plan fatal exception detected')
          PY
          echo 'PASS: Master Plan opens from DIRECTIVE drawer and duration chooser exposes 15/30/45/60/90/120/custom controls without fatal' \
            | tee out/runtime/DIRECTIVE_MASTER_PLAN_RUNTIME_VERDICT.txt
          BASH
          chmod +x runtime-support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh runtime-support/DIRECTIVE_EXEC002_FEATURE_SMOKE.sh
          bash -n runtime-support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh
          bash -n runtime-support/DIRECTIVE_EXEC002_FEATURE_SMOKE.sh
          sha256sum runtime-support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh | tee out/runtime/DIRECTIVE_RUNTIME_VERIFIER.sha256
          sha256sum runtime-support/DIRECTIVE_EXEC002_FEATURE_SMOKE.sh | tee out/runtime/DIRECTIVE_EXEC002_FEATURE_SMOKE.sha256

      - name: Android 16 translated ARM64 clean-install offline acceptance and Master Plan smoke
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          APPLICATION_ID: ${{ env.APPLICATION_ID }}
          APK_PATH: ${{ env.APK_PATH }}
          TARGET_SDK: ${{ env.TARGET_SDK }}
          INSTALL_ABI: ${{ env.INSTALL_ABI }}
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash runtime-support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh && bash runtime-support/DIRECTIVE_EXEC002_FEATURE_SMOKE.sh

      - name: Upload Android 16 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE-EXEC002-android16-runtime-v3
          path: out/runtime/
          if-no-files-found: error
          retention-days: 90

  final_release_and_handover:
    needs: runtime_android16
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download exact signed candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SIGNED_ARTIFACT }}
          path: inputs/signed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.SIGNED_RUN_ID }}
      - name: Download runtime acceptance evidence
        uses: actions/download-artifact@v4
        with:
          name: DIRECTIVE-EXEC002-android16-runtime-v3
          path: inputs/runtime
      - name: Download sealed static completion evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.STATIC_ARTIFACT }}
          path: inputs/static
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.STATIC_RUN_ID }}

      - name: Verify evidence and create timestamped APK handover
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum inputs/signed/DIRECTIVE_EXEC002_SIGNED.apk | awk '{print $1}')"
          test "$ACTUAL" = "$SIGNED_APK_SHA256"
          grep -q '^STATIC_COMPLETION=PASS$' inputs/static/DIRECTIVE_EXEC002_STATIC_COMPLETION.md
          grep -q '^PASS: DIRECTIVE clean install, offline cold launch, usable local organiser UI, process survival, relaunch and offline execution hygiene$' inputs/runtime/DIRECTIVE_RUNTIME_VERDICT.txt
          grep -q '^PASS: Master Plan opens from DIRECTIVE drawer' inputs/runtime/DIRECTIVE_MASTER_PLAN_RUNTIME_VERDICT.txt
          test ! -s inputs/runtime/DIRECTIVE_CRASH_CONTEXT.txt
          test ! -s inputs/runtime/DIRECTIVE_RELAUNCH_CRASH_CONTEXT.txt
          test ! -s inputs/runtime/DIRECTIVE_MASTER_PLAN_CRASH_CONTEXT.txt
          test ! -s inputs/runtime/DIRECTIVE_ONLINE_ERA_CONTEXT.txt
          test ! -s inputs/runtime/DIRECTIVE_RELAUNCH_ONLINE_ERA_CONTEXT.txt

          TIMESTAMP="$(TZ=Europe/London date +'%d%m%Y%H%M%S')"
          FINAL_APK="DIRECTIVE_${TIMESTAMP}.apk"
          HANDOVER="DIRECTIVE_HANDOVER_${TIMESTAMP}.zip"
          mkdir -p release/handover/runtime release/handover/static release/handover/signing
          cp inputs/signed/DIRECTIVE_EXEC002_SIGNED.apk "release/$FINAL_APK"
          sha256sum "release/$FINAL_APK" | tee "release/$FINAL_APK.sha256"
          cp "release/$FINAL_APK" "release/handover/$FINAL_APK"
          cp "release/$FINAL_APK.sha256" "release/handover/$FINAL_APK.sha256"
          cp inputs/static/DIRECTIVE_EXEC002_STATIC_COMPLETION.md release/handover/static/
          cp inputs/static/10_BALANCED_FEATURE_STATIC_MATRIX.txt release/handover/static/ 2>/dev/null || true
          cp inputs/static/DIRECTIVE_BALANCED_UPGRADE_PATCH_REPORT.json release/handover/static/ 2>/dev/null || true
          cp inputs/signed/DIRECTIVE_APKSIGNER_VERIFY.txt release/handover/signing/
          cp inputs/signed/DIRECTIVE_SIGNING_CERT.txt release/handover/signing/
          cp inputs/signed/DIRECTIVE_AAPT_BADGING.txt release/handover/signing/
          cp inputs/signed/DIRECTIVE_AAPT_PERMISSIONS.txt release/handover/signing/
          cp inputs/signed/DIRECTIVE_NATIVE_ABIS.txt release/handover/signing/
          cp -a inputs/runtime/. release/handover/runtime/
          cat > release/handover/DIRECTIVE_EXEC002_FINAL_COMPLETION.md <<EOF
          # DIRECTIVE — EXEC002 Final Completion

          - Authoritative decoded source SHA-256: 40f320d3155fa34a0c4965d3d6848edc5adb39811911d41f0ef36e9f5f78dbbb
          - Static-completion run: $STATIC_RUN_ID
          - Unsigned static candidate SHA-256: $STATIC_CANDIDATE_SHA256
          - Signing run: $SIGNED_RUN_ID
          - Signed APK SHA-256 before final rename: $SIGNED_APK_SHA256
          - Runtime/release run: $GITHUB_RUN_ID
          - Final APK: $FINAL_APK
          - Static completion: PASS
          - Signing / 16 KiB alignment / certificate verification: PASS
          - Package identity / minSdk 21 / targetSdk 37: PASS
          - Hard offline permission boundary: PASS
          - Android 16 translated-ARM64 clean-install cold-launch/relaunch: PASS
          - Main organiser UI / process survival / obsolete-online execution hygiene: PASS
          - Master Plan drawer navigation: PASS
          - Duration chooser presets 15/30/45/60/90/120 + custom: PASS
          - Automated Android 16 acceptance: COMPLETE
          - Physical Galaxy S23+ observation of these exact bytes: NOT EXECUTED; distinct external acceptance observation

          EXEC002_TECHNICAL_COMPLETION=PASS
          APK_READY=YES
          EOF
          cp release/handover/DIRECTIVE_EXEC002_FINAL_COMPLETION.md release/
          (cd release/handover && zip -qr "../$HANDOVER" .)
          sha256sum "release/$HANDOVER" | tee "release/$HANDOVER.sha256"
          printf '%s\n' "$FINAL_APK" > release/FINAL_APK_NAME.txt
          printf '%s\n' "$HANDOVER" > release/HANDOVER_NAME.txt

      - name: Persist final APK and handover to private DIRECTIVE release
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          FINAL_APK="$(cat release/FINAL_APK_NAME.txt)"
          HANDOVER="$(cat release/HANDOVER_NAME.txt)"
          gh release view "$PRIVATE_RELEASE_TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1 \
            || gh release create "$PRIVATE_RELEASE_TAG" --repo "$SOURCE_REPO" --title 'DIRECTIVE EXEC002 Latest' --notes 'Latest EXEC002 technically accepted release.'
          gh release upload "$PRIVATE_RELEASE_TAG" \
            "release/$FINAL_APK" "release/$FINAL_APK.sha256" \
            "release/$HANDOVER" "release/$HANDOVER.sha256" \
            release/DIRECTIVE_EXEC002_FINAL_COMPLETION.md \
            --repo "$SOURCE_REPO" --clobber

      - name: Upload final release package
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE-EXEC002-release-complete-v3
          path: release/
          if-no-files-found: error
          retention-days: 90
