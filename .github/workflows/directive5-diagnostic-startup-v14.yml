name: DIRECTIVE 5 Physical Startup Diagnostic v14

on:
  workflow_dispatch:
  push:
    branches: [directive2-github-build]
    paths:
      - 'support/patch_directive_d5_diagnostic_runtime.py'
      - 'support/directive5_diagnostic_build.sh'
      - '.github/workflows/directive5-diagnostic-startup-v14.yml'
      - 'DIRECTIVE2_SOURCE.json'

permissions:
  contents: read

jobs:
  build:
    name: Build and verify DIRECTIVE 5 diagnostic candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build DIRECTIVE 5 diagnostic startup-capture APK
        shell: bash
        run: |
          chmod +x support/directive5_diagnostic_build.sh
          chmod +x support/patch_directive_d5_diagnostic_runtime.py
          support/directive5_diagnostic_build.sh
      - name: Upload APK and diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE_5_5.0.0_STARTUP_DIAGNOSTIC_v14
          path: |
            out-v8/DIRECTIVE_5_5.0.0_INSTALL_SAFE_TEST.apk
            out-v8/evidence/
          if-no-files-found: error
          retention-days: 30
