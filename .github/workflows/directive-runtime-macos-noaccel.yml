name: DIRECTIVE Android 16 ARM64 Translation Acceptance

on:
  workflow_dispatch:
  push:
    branches: [directive-ci-build-05092026]
    paths:
      - '.github/workflows/directive-runtime-macos-noaccel.yml'

permissions:
  contents: read

env:
  SOURCE_REPO: 3lacksun/-directive-v2-offline
  PRIVATE_CANDIDATE_TAG: directive-ci-candidate
  PRIVATE_RELEASE_TAG: directive-ci-build-latest
  CANDIDATE_NAME: DIRECTIVE_CANDIDATE_33992401441.apk
  CANDIDATE_SHA256: ac5886926a20e6f21cd96acb136126bdcca6e7995e470cbd844918af02a4ea66
  APPLICATION_ID: com.ticktick.task
  TARGET_SDK: '37'
  INSTALL_ABI: arm64-v8a

jobs:
  android16_translated_arm64:
    name: Android 16 translated ARM64 clean-install offline launch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require private DIRECTIVE source token
        env:
          PRIVATE_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm

      - name: Download exact signed DIRECTIVE candidate and verifier
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate runtime-support out/runtime
          gh release download "$PRIVATE_CANDIDATE_TAG" --repo "$SOURCE_REPO" \
            --pattern "$CANDIDATE_NAME" --dir candidate
          echo "$CANDIDATE_SHA256  candidate/$CANDIDATE_NAME" | sha256sum -c -
          gh api "repos/$SOURCE_REPO/contents/support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh?ref=main" \
            --jq .content | tr -d '\n' | base64 --decode \
            > runtime-support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh
          chmod +x runtime-support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh
          echo "APK_PATH=candidate/$CANDIDATE_NAME" >> "$GITHUB_ENV"

      - name: Android 16 ARM64 native-bridge clean-install offline cold-launch acceptance
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          APPLICATION_ID: ${{ env.APPLICATION_ID }}
          APK_PATH: ${{ env.APK_PATH }}
          TARGET_SDK: ${{ env.TARGET_SDK }}
          INSTALL_ABI: ${{ env.INSTALL_ABI }}
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash runtime-support/DIRECTIVE_RUNTIME_ACCEPTANCE.sh

      - name: Finalise timestamped runtime-accepted DIRECTIVE APK
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TIMESTAMP="$(TZ=Europe/London date +'%d%m%Y%H%M%S')"
          FINAL_APK="out/DIRECTIVE_${TIMESTAMP}.apk"
          FINAL_SHA="${FINAL_APK}.sha256"
          EVIDENCE_ZIP="out/DIRECTIVE_RUNTIME_EVIDENCE_${TIMESTAMP}.zip"
          cp "candidate/$CANDIDATE_NAME" "$FINAL_APK"
          sha256sum "$FINAL_APK" | tee "$FINAL_SHA"
          ACTUAL="$(sha256sum "$FINAL_APK" | awk '{print $1}')"
          test "$ACTUAL" = "$CANDIDATE_SHA256"
          zip -qr "$EVIDENCE_ZIP" out/runtime
          {
            echo 'Product: DIRECTIVE'
            echo 'Android 16 API 36 runtime acceptance: PASS'
            echo 'Runtime: Google APIs x86_64 emulator with ARM64 native bridge translation'
            echo "Translated ABI: $INSTALL_ABI"
            echo "Internal compatibility package ID: $APPLICATION_ID"
            echo "Target SDK: $TARGET_SDK"
            echo "APK SHA-256: $ACTUAL"
          } > out/DIRECTIVE_RELEASE_METADATA.txt

          gh release view "$PRIVATE_RELEASE_TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1 \
            || gh release create "$PRIVATE_RELEASE_TAG" --repo "$SOURCE_REPO" \
                 --title 'DIRECTIVE Runtime-Accepted Build' \
                 --notes 'Runtime-accepted Android 16 offline DIRECTIVE APK.'

          OLD_ASSETS="$(gh release view "$PRIVATE_RELEASE_TAG" --repo "$SOURCE_REPO" --json assets \
            --jq '.assets[].name' \
            | grep -E '^DIRECTIVE_[0-9]{14}\.apk(\.sha256)?$|^DIRECTIVE_RUNTIME_EVIDENCE_[0-9]{14}\.zip$|^DIRECTIVE_RELEASE_METADATA\.txt$' \
            || true)"
          if [ -n "$OLD_ASSETS" ]; then
            while IFS= read -r old; do
              [ -n "$old" ] || continue
              gh release delete-asset "$PRIVATE_RELEASE_TAG" "$old" --repo "$SOURCE_REPO" --yes || true
            done <<< "$OLD_ASSETS"
          fi

          gh release upload "$PRIVATE_RELEASE_TAG" \
            "$FINAL_APK" "$FINAL_SHA" "$EVIDENCE_ZIP" out/DIRECTIVE_RELEASE_METADATA.txt \
            --repo "$SOURCE_REPO" --clobber
          echo "FINAL_APK_NAME=$(basename "$FINAL_APK")" >> "$GITHUB_ENV"
          echo "FINAL_APK_SHA256=$ACTUAL" >> "$GITHUB_ENV"
          printf 'PASS: Android 16 translated ARM64 runtime accepted and privately published %s\n' \
            "$(basename "$FINAL_APK")"

      - name: Upload final runtime-accepted APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE-android16-translated-arm64-runtime-accepted
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
          path: |
            out/DIRECTIVE_*.apk
            out/DIRECTIVE_*.apk.sha256
            out/DIRECTIVE_RELEASE_METADATA.txt
            out/DIRECTIVE_RUNTIME_EVIDENCE_*.zip

      - name: Preserve runtime diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE-android16-translated-arm64-failure-evidence
          retention-days: 7
          if-no-files-found: warn
          path: out/runtime/
