name: DIRECTIVE Empty State Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [directive-ci-build-05092026]
    paths:
      - '.github/workflows/directive-empty-state-diagnostic.yml'

permissions:
  contents: read

env:
  SOURCE_REPO: 3lacksun/-directive-v2-offline
  SOURCE_TAG: directive-v2-source-04092026
  SOURCE_ASSET_PATTERN: DIRECTIVE*UIUX_AUDITED_BUILD_READY_SOURCE_04092026175739-1.zip
  SOURCE_SHA256: 40f320d3155fa34a0c4965d3d6848edc5adb39811911d41f0ef36e9f5f78dbbb

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private source token
        env:
          PRIVATE_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Download frozen source
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input extracted diag
          gh release download "$SOURCE_TAG" --repo "$SOURCE_REPO" --pattern "$SOURCE_ASSET_PATTERN" --dir input
          SOURCE_DOWNLOADED="$(find input -maxdepth 1 -type f -name "$SOURCE_ASSET_PATTERN" -print -quit)"
          echo "$SOURCE_SHA256  $SOURCE_DOWNLOADED" | sha256sum -c -
          unzip -q "$SOURCE_DOWNLOADED" -d extracted
          ROOT="$(find extracted -type f -name apktool.yml -printf '%h\n' | head -n1)"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Trace cloud account empty-state model
        shell: bash
        run: |
          set -euo pipefail
          OUT=diag/DIRECTIVE_EMPTY_STATE_DIAGNOSTIC.txt
          : > "$OUT"
          echo '=== Resource field references ===' >> "$OUT"
          grep -R -n -E 'tips_save_to_cloud|tips_try_sign_in|create_account' "$ROOT"/smali* --include='*.smali' | head -n 4000 >> "$OUT" || true
          echo '=== EmptyViewFactory files ===' >> "$OUT"
          for p in $(find "$ROOT" -path '*/com/ticktick/task/helper/EmptyViewFactory*.smali' -print); do
            echo "===== ${p#$ROOT/} =====" >> "$OUT"
            sed -n '1,3200p' "$p" >> "$OUT"
          done
          echo '=== Callers setting cloud/account model ===' >> "$OUT"
          grep -R -n -E 'tips_save_to_cloud|tips_try_sign_in|create_account|EmptyViewFactory;->' "$ROOT"/smali* --include='*.smali' \
            | grep '/com/ticktick/' | head -n 7000 >> "$OUT" || true
          wc -c "$OUT"
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE-empty-state-diagnostic
          retention-days: 7
          path: diag/DIRECTIVE_EMPTY_STATE_DIAGNOSTIC.txt
