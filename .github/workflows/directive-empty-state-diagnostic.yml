name: DIRECTIVE Empty State Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [directive-ci-build-05092026]
    paths:
      - '.github/workflows/directive-empty-state-diagnostic.yml'

permissions:
  contents: read

env:
  SOURCE_REPO: 3lacksun/-directive-v2-offline
  SOURCE_TAG: directive-v2-source-04092026
  SOURCE_ASSET_PATTERN: DIRECTIVE*UIUX_AUDITED_BUILD_READY_SOURCE_04092026175739-1.zip
  SOURCE_SHA256: 40f320d3155fa34a0c4965d3d6848edc5adb39811911d41f0ef36e9f5f78dbbb

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private source token
        env:
          PRIVATE_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Download frozen source
        env:
          GH_TOKEN: ${{ secrets.DIRECTIVE_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input extracted diag
          gh release download "$SOURCE_TAG" --repo "$SOURCE_REPO" --pattern "$SOURCE_ASSET_PATTERN" --dir input
          SOURCE_DOWNLOADED="$(find input -maxdepth 1 -type f -name "$SOURCE_ASSET_PATTERN" -print -quit)"
          echo "$SOURCE_SHA256  $SOURCE_DOWNLOADED" | sha256sum -c -
          unzip -q "$SOURCE_DOWNLOADED" -d extracted
          ROOT="$(find extracted -type f -name apktool.yml -printf '%h\n' | head -n1)"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Trace cloud account empty-state model
        shell: bash
        run: |
          set -euo pipefail
          OUT=diag/DIRECTIVE_EMPTY_STATE_DIAGNOSTIC.txt
          : > "$OUT"
          EV="$(find "$ROOT" -path '*/com/ticktick/task/helper/EmptyViewFactory.smali' -print -quit)"
          PL="$(find "$ROOT" -path '*/com/ticktick/task/controller/viewcontroller/ProjectListChildFragment.smali' -print -quit)"
          test -n "$EV"; test -n "$PL"
          echo '=== EmptyViewFactory exact cloud model region 4760-5030 ===' >> "$OUT"
          sed -n '4760,5030p' "$EV" >> "$OUT"
          echo '=== ProjectListChildFragment exact create-account region 7380-7660 ===' >> "$OUT"
          sed -n '7380,7660p' "$PL" >> "$OUT"
          echo '=== Enclosing methods by resource-reference scan ===' >> "$OUT"
          python3 - "$EV" "$PL" >> "$OUT" <<'PY'
          from pathlib import Path
          import re,sys
          for p in map(Path,sys.argv[1:]):
              text=p.read_text('utf-8')
              print('=====',p.name,'=====')
              for m in re.finditer(r'(?ms)^\.method [^\n]*\n.*?^\.end method$',text):
                  block=m.group(0)
                  if any(k in block for k in ('tips_save_to_cloud','tips_try_sign_in','create_account')):
                      print(block[:50000]); print('---')
          PY
          wc -c "$OUT"
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE-empty-state-diagnostic
          retention-days: 7
          path: diag/DIRECTIVE_EMPTY_STATE_DIAGNOSTIC.txt
