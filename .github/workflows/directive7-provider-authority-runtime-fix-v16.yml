name: DIRECTIVE 7 Provider Authority Runtime Fix v16

on:
  workflow_dispatch:
  push:
    branches:
      - directive2-github-build
    paths:
      - 'support/directive7_provider_authority_fix_build.sh'
      - 'support/patch_directive_provider_authority_namespace.py'
      - '.github/workflows/directive7-provider-authority-runtime-fix-v16.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify DIRECTIVE 7
        shell: bash
        run: |
          chmod +x support/directive7_provider_authority_fix_build.sh
          support/directive7_provider_authority_fix_build.sh
      - name: Upload APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: DIRECTIVE_7_7.0.0_PROVIDER_AUTHORITY_FIX_v16
          path: |
            out-v8/DIRECTIVE_7_7.0.0_INSTALL_SAFE_TEST.apk
            out-v8/evidence/
          if-no-files-found: error
          retention-days: 30
