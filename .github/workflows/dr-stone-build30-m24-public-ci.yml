name: Dr Stone Command Build 30 offline-toolchain bootstrap

on:
  push:
    branches:
      - dr-stone-build30-m24-public-ci-030920260853
    paths:
      - '.github/workflows/dr-stone-build30-m24-public-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.11.1'
  GRADLE_SHA256: 'f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6'
  BUNDLE_NAME: 'dr-stone-build30-offline-toolchain'

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ''
          accept-android-sdk-licenses: true
      - name: Install exact Android SDK 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Download exact Gradle distribution
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          echo "$GRADLE_SHA256  $RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip" -d "$RUNNER_TEMP"
          echo "GRADLE_BIN=$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin/gradle" >> "$GITHUB_ENV"
      - name: Create dependency-equivalent source-free Android project
        shell: bash
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/cache-project"
          mkdir -p "$P/app/src/main/java/com/nexarenew/cache" "$P/app/src/test/java/com/nexarenew/cache" "$P/app/src/main/res/values"
          cat > "$P/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DrStoneCacheBootstrap"
          include(":app")
          EOF
          cat > "$P/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.10.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.21" apply false
          }
          EOF
          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          cat > "$P/app/build.gradle.kts" <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android"); id("org.jetbrains.kotlin.plugin.compose") }
          android {
              namespace = "com.nexarenew.cache"; compileSdk = 36
              defaultConfig { applicationId = "com.nexarenew.cache"; minSdk = 26; targetSdk = 36; versionCode = 1; versionName = "1.0"; testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner" }
              buildFeatures { compose = true; buildConfig = true }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }
          }
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2025.12.00")
              implementation(composeBom); androidTestImplementation(composeBom)
              androidTestImplementation("androidx.test.ext:junit:1.2.1"); androidTestImplementation("androidx.test:core-ktx:1.6.1"); androidTestImplementation("androidx.test:runner:1.6.2")
              implementation("androidx.activity:activity-compose:1.10.1"); implementation("androidx.core:core-ktx:1.16.0")
              implementation("androidx.compose.material3:material3"); implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.ui:ui"); implementation("androidx.compose.ui:ui-tooling-preview"); debugImplementation("androidx.compose.ui:ui-tooling")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.9.1"); implementation("androidx.lifecycle:lifecycle-runtime-compose:2.9.1"); implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1")
              implementation("androidx.navigation:navigation-compose:2.9.0"); implementation("androidx.work:work-runtime-ktx:2.10.1"); implementation("androidx.datastore:datastore-preferences:1.2.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"); implementation("com.tom-roush:pdfbox-android:2.0.27.0"); testImplementation("junit:junit:4.13.2")
          }
          EOF
          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme" /></manifest>
          EOF
          cat > "$P/app/src/main/res/values/styles.xml" <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" /></resources>
          EOF
          printf 'package com.nexarenew.cache\nclass Cache\n' > "$P/app/src/main/java/com/nexarenew/cache/Cache.kt"
          printf 'package com.nexarenew.cache\nimport org.junit.Test\nclass CacheTest { @Test fun cache() = Unit }\n' > "$P/app/src/test/java/com/nexarenew/cache/CacheTest.kt"
          echo "CACHE_PROJECT=$P" >> "$GITHUB_ENV"
      - name: Resolve exact plugins dependencies compiler lint and test toolchain
        shell: bash
        working-directory: ${{ env.CACHE_PROJECT }}
        run: |
          set -euo pipefail
          "$GRADLE_BIN" --no-daemon --max-workers=2 :app:dependencies
          "$GRADLE_BIN" --no-daemon --max-workers=2 testDebugUnitTest compileDebugKotlin lintDebug assembleDebug
      - name: Package minimal portable offline toolchain
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/offline-bundle"
          mkdir -p "$OUT/gradle-home/caches" "$OUT/android-sdk/platforms" "$OUT/android-sdk/build-tools" "$OUT/gradle-dist"
          for p in "$HOME/.gradle/caches/modules-2" "$HOME/.gradle/caches/8.11.1" "$HOME/.gradle/caches/jars-9" "$HOME/.gradle/caches/transforms-4" "$HOME/.gradle/caches/journal-1"; do
            if [ -e "$p" ]; then cp -a "$p" "$OUT/gradle-home/caches/"; fi
          done
          if [ -d "$HOME/.gradle/native" ]; then cp -a "$HOME/.gradle/native" "$OUT/gradle-home/"; fi
          cp -a "$RUNNER_TEMP/gradle-${GRADLE_VERSION}" "$OUT/gradle-dist/"
          cp -a "$ANDROID_HOME/platforms/android-36" "$OUT/android-sdk/platforms/"
          cp -a "$ANDROID_HOME/build-tools/36.0.0" "$OUT/android-sdk/build-tools/"
          cp -a "$ANDROID_HOME/platform-tools" "$OUT/android-sdk/"
          cp -a "$ANDROID_HOME/licenses" "$OUT/android-sdk/"
          du -sh "$OUT"/* "$OUT/gradle-home/caches"/*
          tar --zstd -cf "$GITHUB_WORKSPACE/${BUNDLE_NAME}.tar.zst" -C "$OUT" .
          sha256sum "$GITHUB_WORKSPACE/${BUNDLE_NAME}.tar.zst" | tee "$GITHUB_WORKSPACE/${BUNDLE_NAME}.tar.zst.sha256"
          stat -c '%s' "$GITHUB_WORKSPACE/${BUNDLE_NAME}.tar.zst"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ${{ env.BUNDLE_NAME }}
          path: |
            ${{ env.BUNDLE_NAME }}.tar.zst
            ${{ env.BUNDLE_NAME }}.tar.zst.sha256
          if-no-files-found: error
          retention-days: 1
