name: Dr Stone Command Build 30 M24 temporary public-runner verification

on:
  push:
    branches:
      - dr-stone-build30-m24-public-ci-030920260853
    paths:
      - '.github/workflows/dr-stone-build30-m24-public-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_FILE_ID: "1k_pl_rLWw3S7nAcynu0NzS7zRlRPaOkP"
  SOURCE_ZIP: "DR_STONE_COMMAND_V0_3_0_BUILD30_M24_CI_CANDIDATE_03092026075959.zip"
  SOURCE_SHA256: "fc5bf3f3cb82ad0f14dd0f953f88ef9da32368b092cd2ee6abb2025926bd1f7d"
  APK_NAME: "DR_STONE_COMMAND_V0_3_0_BUILD30_M24_DEBUG.apk"
  EVIDENCE_DIR: "build30-m24-evidence"

jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ''
          accept-android-sdk-licenses: true
      - name: Download and verify exact Build 30 candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          curl -fL --retry 5 --retry-all-errors \
            "https://drive.usercontent.google.com/download?id=${SOURCE_FILE_ID}&export=download&confirm=t" \
            -o "$SOURCE_ZIP"
          echo "$SOURCE_SHA256  $SOURCE_ZIP" | sha256sum -c - | tee "$EVIDENCE_DIR/source-sha256.txt"
          unzip -t "$SOURCE_ZIP" | tee "$EVIDENCE_DIR/source-zip-integrity.txt"
          rm -rf "$RUNNER_TEMP/build30-m24"
          mkdir -p "$RUNNER_TEMP/build30-m24"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/build30-m24"
          SRC_DIR="$(find "$RUNNER_TEMP/build30-m24" -mindepth 1 -maxdepth 1 -type d | head -1)"
          if [ -z "$SRC_DIR" ]; then SRC_DIR="$RUNNER_TEMP/build30-m24"; fi
          test -f "$SRC_DIR/app/build.gradle.kts"
          chmod +x "$SRC_DIR/gradlew"
          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Verify identity and source contracts
        shell: bash
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          grep -F 'applicationId = "com.nexarenew.drstonecommand"' app/build.gradle.kts
          grep -F 'versionCode = 30' app/build.gradle.kts
          grep -F 'versionName = "0.3.0"' app/build.gradle.kts
          grep -F 'compileSdk = 36' app/build.gradle.kts
          grep -F 'targetSdk = 36' app/build.gradle.kts
          bash tools/run-pure-tests.sh | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/pure-tests.txt"
          bash tools/verify-dr-stone-release-contracts.sh | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/release-contracts.txt"
          bash tools/verify-ux-feature-patch.sh | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/ux-contracts.txt"
          bash tools/verify-build25-feature-contracts.sh | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/retained-feature-contracts.txt"
          bash tools/verify-large-file-contracts.sh | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/large-file-contracts.txt"
          bash tools/verify-media-feature-contracts.sh | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/media-contracts.txt"
      - name: Android unit tests
        shell: bash
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 testDebugUnitTest | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/testDebugUnitTest.txt"
      - name: Kotlin compilation
        shell: bash
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 compileDebugKotlin | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/compileDebugKotlin.txt"
      - name: Android lint
        shell: bash
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 lintDebug | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/lintDebug.txt"
      - name: Clean assembleDebug
        shell: bash
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 clean assembleDebug | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/assembleDebug.txt"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/$APK_NAME"
      - name: APK forensics
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging "$APK_NAME" | tee "$EVIDENCE_DIR/apk-badging.txt"
          grep -F "package: name='com.nexarenew.drstonecommand' versionCode='30' versionName='0.3.0'" "$EVIDENCE_DIR/apk-badging.txt"
          grep -F "sdkVersion:'26'" "$EVIDENCE_DIR/apk-badging.txt"
          grep -F "targetSdkVersion:'36'" "$EVIDENCE_DIR/apk-badging.txt"
          grep -F "application-label:'Dr Stone Command'" "$EVIDENCE_DIR/apk-badging.txt"
          "$BT/aapt" dump permissions "$APK_NAME" | tee "$EVIDENCE_DIR/apk-permissions.txt"
          "$BT/aapt" dump xmltree "$APK_NAME" AndroidManifest.xml | tee "$EVIDENCE_DIR/apk-manifest.txt"
          "$BT/zipalign" -c -v 4 "$APK_NAME" | tee "$EVIDENCE_DIR/zipalign.txt"
          "$BT/apksigner" verify --verbose --print-certs "$APK_NAME" | tee "$EVIDENCE_DIR/apksigner.txt"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"
          stat -c '%s' "$APK_NAME" | tee "$EVIDENCE_DIR/apk-size-bytes.txt"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: dr-stone-command-build30-m24-debug
          path: |
            DR_STONE_COMMAND_V0_3_0_BUILD30_M24_DEBUG.apk
            DR_STONE_COMMAND_V0_3_0_BUILD30_M24_DEBUG.apk.sha256
            build30-m24-evidence/
          if-no-files-found: error
          retention-days: 14
